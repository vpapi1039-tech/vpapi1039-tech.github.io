  let currentChoices = [];
  let firstLevelSkillIds = new Set();
  const REPEAT_WEIGHT = 0.08;

  // ── LEVEL-UP / SKILL CHOICE SYSTEM — offer, render, apply picked skill ──
  function triggerLevelUp() {
    player.exp -= player.expToNext;
    player.level++;
    player.expToNext = expForLevel(player.level);
    player.levelUpCount = (player.levelUpCount || 0) + 1;
    addRainbowParticles(player.x, player.y, 40, 7);
    addGlitterParticles(player.x, player.y, 24);
    addShockwave(player.x, player.y, 140, '#c65fff');
    addShockwave(player.x, player.y, 90, '#ff5fd6');
    sfxLevelUp();
    phase = 'levelup';
    offerSkillChoices();
  }

  function weightedPickIndex(pool) {
    const total = pool.reduce((sum, item) => sum + item.weight, 0);
    let r = rand() * total;
    for (let i = 0; i < pool.length; i++) {
      r -= pool[i].weight;
      if (r <= 0) return i;
    }
    return pool.length - 1;
  }

  function offerSkillChoices() {
    const isFirstLevelUp = firstLevelSkillIds.size === 0;
    const usesLaser = player.defaultWeapon === 'laser'; // PRISM: permanent beam, never fires magazine bullets
    const eligible = SKILL_POOL.filter(skill =>
      !(skill.maxStacks && (player.skills[skill.id] || 0) >= skill.maxStacks) &&
      !(usesLaser && skill.magOnly) &&
      !(!usesLaser && skill.laserOnly)
    );
    const pool = eligible.map(skill => ({
      skill,
      weight: (!isFirstLevelUp && firstLevelSkillIds.has(skill.id)) ? REPEAT_WEIGHT : 1,
    }));
    currentChoices = [];
    const choiceCount = player.skillChoiceCount || 3;

    // Warden: every 3rd level-up guarantees a Thorn Aura offer among the choices;
    // the rest of the time it's still just in the normal random pool like anything else.
    if (player.character === 'circle' && player.levelUpCount > 0 && player.levelUpCount % 3 === 0) {
      const thornIdx = pool.findIndex(item => item.skill.id === 'thorn');
      if (thornIdx !== -1) currentChoices.push(pool.splice(thornIdx, 1)[0].skill);
    }

    for (let i = currentChoices.length; i < choiceCount && pool.length; i++) {
      const idx = weightedPickIndex(pool);
      currentChoices.push(pool.splice(idx, 1)[0].skill);
    }
    if (isFirstLevelUp) {
      currentChoices.forEach(skill => firstLevelSkillIds.add(skill.id));
    }
    renderLevelUpOverlay();
  }

  function renderLevelUpOverlay() {
    levelupSub.textContent = `Level ${player.level} — choose a bonus`;
    levelupCards.innerHTML = '';
    currentChoices.forEach(skill => {
      const card = document.createElement('div');
      card.className = 'levelup-card';
      const nameEl = document.createElement('div');
      nameEl.className = 'lu-name';
      nameEl.textContent = skill.name;
      const descEl = document.createElement('div');
      descEl.className = 'lu-desc';
      descEl.textContent = skill.desc;
      card.appendChild(nameEl);
      card.appendChild(descEl);
      card.addEventListener('click', () => chooseSkill(skill));
      levelupCards.appendChild(card);
    });
    levelupOverlay.classList.remove('hidden');
    controls.classList.add('hidden');
  }

  function chooseSkill(skill) {
    skill.apply(player);
    player.skills[skill.id] = (player.skills[skill.id] || 0) + 1;
    sfxUiClick();
    levelupOverlay.classList.add('hidden');
    controls.classList.remove('hidden');
    phase = 'playing';
    saveCheckpoint();
  }

  // ── ENEMY SPAWNING & AI — wave/boss spawns, sentinel + ghost behavior, enemy factory ──
  // Boss fights repeat every 15 waves, alternating: Ghost Gang on odd multiples of 15
  // (15, 45, 75, ...), Sentinel on even multiples (30, 60, 90, ...) — each repeat scales
  // up automatically since enemy HP already compounds with wave via hpScalePerWave.
  const BOSS_CYCLE = 15;
  function spawnWave() {
    if (wave % BOSS_CYCLE === 0) {
      const cycleIndex = wave / BOSS_CYCLE;
      if (cycleIndex % 2 === 1) { spawnBossWave(); return; }
      else { spawnBoss2Wave(); return; }
    }
    bossActive = false;
    saveCheckpoint();
    const w = CONFIG.wave;
    const count = Math.min(w.countCap, w.base + wave * w.perWave + Math.floor(wave * wave * w.quadratic));
    const stagger = Math.max(w.staggerMin, w.staggerStart - wave * w.staggerPerWave);
    const myWave = wave;
    for (let i = 0; i < count; i++) {
      const id = setTimeout(() => {
        if (phase !== 'over' && wave === myWave) enemies.push(makeEnemy());
      }, Math.max(i * stagger, 1));
      pendingSpawns.push({ id });
    }
  }

  // Boss fight: the ghost gang arrives together, no regular grunts alongside them.
  function spawnBossWave() {
    saveCheckpoint();
    bossActive = true;
    bossBannerUntil = performance.now() + CONFIG.boss.bannerMs;
    sfxBossBanner();
    const st = CONFIG.enemy.types.ghost;
    const hpMult = Math.pow(1 + CONFIG.enemy.hpScalePerWave, wave - 1);
    const hp = Math.round(st.hp * hpMult);
    const n = GHOST_GANG.length;
    GHOST_GANG.forEach((g, i) => {
      const ang = (Math.PI * 2 / n) * i + Math.PI / 4;
      const x = Math.max(30, Math.min(WORLD_W - 30, player.x + Math.cos(ang) * CONFIG.boss.spawnDist));
      const y = Math.max(30, Math.min(WORLD_H - 30, player.y + Math.sin(ang) * CONFIG.boss.spawnDist));
      const isShooter = !!g.shooter;
      enemies.push({
        type: 'ghost', ghostId: g.id, ghostName: g.name, behavior: g.behavior,
        x, y, r: st.r, speed: st.speed * g.speedMult, angle: 0,
        hp, maxHp: hp, dmg: st.dmg, pts: st.pts, exp: st.exp, color: g.color,
        flankOffset: 0, retargetAt: 0, lastHitAt: -Infinity,
        fleeCount: 0, wasRetreating: false,
        shooter: isShooter, lastShotAt: isShooter ? -rand() * CONFIG.boss.ghostShooter.fireRateMs : 0,
      });
    });
  }

  // Boss fight: a lone hovering core that circles the player, weaves bullet-ring and
  // aimed-burst attacks, then summons reinforcements once it drops to half HP.
  function spawnBoss2Wave() {
    saveCheckpoint();
    bossActive = true;
    bossBannerUntil = performance.now() + CONFIG.boss2.bannerMs;
    sfxBossBanner();
    const st = CONFIG.enemy.types.sentinel;
    const hpMult = Math.pow(1 + CONFIG.enemy.hpScalePerWave, wave - 1);
    const hp = Math.round(st.hp * hpMult);
    const ang = rand() * Math.PI * 2;
    const x = Math.max(40, Math.min(WORLD_W - 40, player.x + Math.cos(ang) * CONFIG.boss2.spawnDist));
    const y = Math.max(40, Math.min(WORLD_H - 40, player.y + Math.sin(ang) * CONFIG.boss2.spawnDist));
    const now = performance.now();
    enemies.push({
      type: 'sentinel', x, y, r: st.r, speed: st.speed, angle: 0,
      hp, maxHp: hp, dmg: st.dmg, pts: st.pts, exp: st.exp, color: st.color,
      lastHitAt: -Infinity, strafeDir: rand() < 0.5 ? 1 : -1,
      nextRingAt: now + 1400, nextBurstAt: now + 2200,
      rotation: 0, enraged: false,
    });
  }

  // Sentinel movement + attack pattern, called each frame while it's alive.
  function updateSentinel(en, now, dt) {
    const bc = CONFIG.boss2;
    const a = Math.atan2(player.y - en.y, player.x - en.x);
    const dPlayer = dist(en.x, en.y, player.x, player.y);
    en.rotation += dt * (en.enraged ? 1.8 : 1);

    if (dPlayer > bc.hoverRange + bc.hoverSlop) {
      en.x += Math.cos(a) * en.speed;
      en.y += Math.sin(a) * en.speed;
    } else if (dPlayer < bc.hoverRange - bc.hoverSlop) {
      en.x -= Math.cos(a) * en.speed;
      en.y -= Math.sin(a) * en.speed;
    } else {
      en.x += Math.cos(a + Math.PI / 2) * en.speed * bc.strafeSpeedMult * en.strafeDir;
      en.y += Math.sin(a + Math.PI / 2) * en.speed * bc.strafeSpeedMult * en.strafeDir;
    }
    en.x = Math.max(en.r, Math.min(WORLD_W - en.r, en.x));
    en.y = Math.max(en.r, Math.min(WORLD_H - en.r, en.y));

    const rateMult = en.enraged ? bc.enrageFireRateMult : 1;

    if (now >= en.nextRingAt) {
      en.nextRingAt = now + bc.ring.intervalMs * rateMult;
      en.ringPhase = (en.ringPhase || 0) + bc.ring.phaseStep;
      for (let i = 0; i < bc.ring.count; i++) {
        const rAng = (Math.PI * 2 / bc.ring.count) * i + en.ringPhase;
        enemyBullets.push({
          x: en.x + Math.cos(rAng) * en.r, y: en.y + Math.sin(rAng) * en.r,
          vx: Math.cos(rAng) * bc.ring.bulletSpeed, vy: Math.sin(rAng) * bc.ring.bulletSpeed,
          r: bc.ring.bulletR, life: bc.ring.bulletLife, dmg: bc.ring.bulletDamage,
        });
      }
      addParticles(en.x, en.y, en.color, 16, 3, true);
      shake = Math.min(shake + 3, CONFIG.shake.onHitCap);
    }

    if (now >= en.nextBurstAt) {
      en.nextBurstAt = now + bc.burst.intervalMs * rateMult;
      const half = (bc.burst.count - 1) / 2;
      for (let i = 0; i < bc.burst.count; i++) {
        const bAng = a + (i - half) * bc.burst.spreadAngle;
        const mx = en.x + Math.cos(bAng) * en.r, my = en.y + Math.sin(bAng) * en.r;
        enemyBullets.push({
          x: mx, y: my, vx: Math.cos(bAng) * bc.burst.bulletSpeed, vy: Math.sin(bAng) * bc.burst.bulletSpeed,
          r: bc.burst.bulletR, life: bc.burst.bulletLife, dmg: bc.burst.bulletDamage,
        });
        addParticles(mx, my, '#eaf6ff', 3, 2, true);
      }
    }

    if (!en.enraged && en.hp <= en.maxHp * bc.enrageHpFrac) {
      en.enraged = true;
      en.speed *= bc.enrageSpeedMult;
      addRainbowParticles(en.x, en.y, 30, 6);
      shake = Math.min(shake + CONFIG.shake.onKillCap, CONFIG.shake.onKillCap * 1.4);
      for (let i = 0; i < bc.enrageAddCount; i++) {
        const sAng = (Math.PI * 2 / bc.enrageAddCount) * i;
        const sx = Math.max(30, Math.min(WORLD_W - 30, en.x + Math.cos(sAng) * 90));
        const sy = Math.max(30, Math.min(WORLD_H - 30, en.y + Math.sin(sAng) * 90));
        const addType = rand() < 0.5 ? 'brute' : 'grunt';
        const et = CONFIG.enemy.types[addType];
        const addHpMult = Math.pow(1 + CONFIG.enemy.hpScalePerWave, wave - 1);
        const addHp = Math.round(et.hp * addHpMult);
        enemies.push({
          type: addType, x: sx, y: sy, r: et.r, speed: et.speed, angle: 0,
          hp: addHp, maxHp: addHp, dmg: et.dmg, pts: et.pts, exp: et.exp, color: et.color,
        });
      }
    }
  }

  function makeEnemy() {
    const edge = Math.floor(rand() * 4);
    let x, y;
    switch (edge) {
      case 0: x = rand() * WORLD_W; y = -30; break;
      case 1: x = WORLD_W + 30; y = rand() * WORLD_H; break;
      case 2: x = rand() * WORLD_W; y = WORLD_H + 30; break;
      default: x = -30; y = rand() * WORLD_H; break;
    }
    const e = CONFIG.enemy;
    const roll = rand();
    let type = 'grunt';
    if (wave >= e.bruteMinWave && roll > e.bruteRoll) type = 'brute';
    else if (wave >= e.sprinterMinWave && roll > e.sprinterRoll) type = 'sprinter';

    const st = e.types[type];
    const hpMult = Math.pow(1 + e.hpScalePerWave, wave - 1); // enemies get tankier every wave
    const hp = Math.round(st.hp * hpMult);
    const en = { type, x, y, r: st.r, speed: st.speed, angle: 0,
             hp, maxHp: hp, dmg: st.dmg, pts: st.pts, exp: st.exp, color: st.color };
    if (type === 'sprinter') {
      const rc = e.sprinterRanged;
      // 0 at the wave sprinters first appear, ramping to 1 by scaleCapWave — locked in at spawn time
      const t = Math.max(0, Math.min(1, (wave - e.sprinterMinWave) / (rc.scaleCapWave - e.sprinterMinWave)));
      en.tacticsT = t;
      en.speed = st.speed * (rc.agilityMultEarly + (1 - rc.agilityMultEarly) * t); // sluggish early, full agility at the cap
      en.fireRateMs = rc.fireRateMsEarly + (rc.fireRateMsCap - rc.fireRateMsEarly) * t;
      en.strafeMult = rc.strafeMult * t;      // no strafing at all until it's learned some tactics
      en.backoffMult = Math.max(0, Math.min(1, t * 1.5)); // no back-off/dodge at all early on
      en.strafeDir = rand() < 0.5 ? 1 : -1;
      en.lastShotAt = -rand() * en.fireRateMs; // stagger first shots
    }
    return en;
  }

  // Each ghost gets its own classic pursuit behavior instead of a plain beeline.
  function updateGhostMovement(en, now) {
    const bc = CONFIG.boss;
    const toPlayerAngle = Math.atan2(player.y - en.y, player.x - en.x);
    let moveAngle = toPlayerAngle;

    const canFlee = en.fleeCount < bc.maxFlees;
    const retreating = canFlee && (en.hp / en.maxHp <= bc.retreatHpFrac);
    if (retreating && !en.wasRetreating) en.fleeCount++; // spends one of its two panic-flees
    en.wasRetreating = retreating;
    if (retreating) {
      // spooked — low on health, so it bolts away from the player instead of following its usual pattern
      moveAngle = toPlayerAngle + Math.PI;
    } else if (en.behavior === 'chase') {
      // Blinky: relentless, always heads straight for the player.
      moveAngle = toPlayerAngle;
    } else if (en.behavior === 'ambush') {
      // Pinky: aims for a point out ahead of where the player is facing, to cut them off.
      const tx = player.x + Math.cos(player.angle) * bc.pinkyLead;
      const ty = player.y + Math.sin(player.angle) * bc.pinkyLead;
      moveAngle = Math.atan2(ty - en.y, tx - en.x);
    } else if (en.behavior === 'flank') {
      // Inky: erratic — swings wide before darting back in, re-rolling the swing periodically.
      if (now >= en.retargetAt) {
        en.flankOffset = (rand() < 0.5 ? 1 : -1) * (0.85 + rand() * 0.9);
        en.retargetAt = now + 800 + rand() * 900;
      }
      const dPlayer = dist(en.x, en.y, player.x, player.y);
      moveAngle = toPlayerAngle + (dPlayer < 220 ? en.flankOffset : en.flankOffset * 0.35);
    } else if (en.behavior === 'shy') {
      // Clyde: chases from a distance but loses his nerve and flees once he gets close.
      const dPlayer = dist(en.x, en.y, player.x, player.y);
      moveAngle = dPlayer < bc.clydeShyRange ? toPlayerAngle + Math.PI : toPlayerAngle;
    }

    const moveSpeed = retreating ? en.speed * bc.retreatSpeedMult : en.speed;
    en.x += Math.cos(moveAngle) * moveSpeed;
    en.y += Math.sin(moveAngle) * moveSpeed;
    en.x = Math.max(en.r, Math.min(WORLD_W - en.r, en.x));
    en.y = Math.max(en.r, Math.min(WORLD_H - en.r, en.y));
    en.angle = toPlayerAngle; // eyes always track the player, ghost-style
  }

  // ── PARTICLE EFFECTS — hit sparks, explosions, rainbow/glitter bursts ──
  function addParticles(x, y, color, n = 10, speed = 4, glow = false) {
    for (let i = 0; i < n; i++) {
      const a = rand() * Math.PI * 2, s = rand() * speed + 1;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, size: rand() * 3 + 1.5, color, glow });
    }
  }

  function triggerBruteExplosion(x, y, now) {
    const ecfg = CONFIG.enemy, pcfg = CONFIG.player;
    addParticles(x, y, '#ffae42', 20, 7, true);
    addParticles(x, y, '#ff4d4d', 10, 5, true);
    addShockwave(x, y, ecfg.bruteExplodeRadius * 1.3, '#ffae42');
    shake = Math.min(shake + CONFIG.shake.onKillCap, CONFIG.shake.onKillCap * 1.4);

    if (dist(x, y, player.x, player.y) < ecfg.bruteExplodeRadius) {
      let incoming = ecfg.bruteExplodeDamage;
      if (player.hp <= pcfg.lowHpThreshold) {
        const hpClamped = Math.max(1, player.hp);
        const t = (pcfg.lowHpThreshold - hpClamped) / (pcfg.lowHpThreshold - 1);
        const reduction = pcfg.lowHpMinReduction + t * (pcfg.lowHpMaxReduction - pcfg.lowHpMinReduction);
        incoming *= (1 - reduction);
      }
      if (player.dmgReduction) incoming *= (1 - player.dmgReduction);
      if (now < player.shieldInvulnUntil) {
        incoming = 0;
      } else if (player.shieldCharges > 0) {
        player.shieldCharges--;
        player.shieldInvulnUntil = now + 500;
        syncShieldStacks(player, player.shieldCharges);
        incoming = 0;
        addParticles(player.x, player.y, '#7cfcff', 10, 4, true);
        sfxShieldBlock();
      }
      if (incoming > 0) {
        player.hp -= incoming;
        player.lastDamagedAt = now;
        shake = Math.min(shake + CONFIG.shake.onHit, CONFIG.shake.onHitCap);
        addParticles(player.x, player.y, '#ff4d4d', 4, 3);
        flashHit(now);
      }
    }

    for (const other of enemies) {
      if (dist(x, y, other.x, other.y) < ecfg.bruteExplodeRadius) {
        other.hp -= ecfg.bruteExplodeDamage;
      }
    }
  }

  function addRainbowParticles(x, y, n = 10, speed = 4) {
    const cfg = CONFIG.particles.killBurst;
    for (let i = 0; i < n; i++) {
      const a = rand() * Math.PI * 2, s = rand() * speed + 1;
      const hue = Math.floor(rand() * 360);
      const spark = rand() < cfg.sparkChance;
      particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1,
        size: spark ? rand() * 1.3 + 0.8 : rand() * 3 + 1.8,
        color: `hsl(${hue}, 100%, ${spark ? 85 : 60}%)`,
        twinkleFreq: rand() * 12 + 8, twinklePhase: rand() * Math.PI * 2, glow: true,
      });
    }
    for (let i = 0; i < Math.round(n * cfg.glintRatio); i++) {
      const a = rand() * Math.PI * 2, s = rand() * speed * 0.7 + 0.5;
      particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1,
        size: rand() * 1.2 + 0.7, color: '#ffffff',
        twinkleFreq: rand() * 18 + 14, twinklePhase: rand() * Math.PI * 2, glow: true,
      });
    }
  }

  // Little drifting star-shaped sparkles that linger after a kill, like scattered glitter.
  const GLITTER_COLORS = ['#ffffff', '#fff6cf', '#ffd166', '#c6f5ff', '#f2d9ff'];
  function addGlitterParticles(x, y, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = rand() * Math.PI * 2;
      const s = rand() * 2.2 + 0.4;
      particles.push({
        x: x + (rand() - 0.5) * 10, y: y + (rand() - 0.5) * 10,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.6, // slight upward drift
        gravity: 0.045,           // gentle fall, like glitter settling
        life: 1, lifeSpan: rand() * 0.9 + 0.9, // lingers a bit longer than the burst particles
        size: rand() * 2 + 1.1,
        color: GLITTER_COLORS[Math.floor(rand() * GLITTER_COLORS.length)],
        twinkleFreq: rand() * 22 + 16, twinklePhase: rand() * Math.PI * 2,
        glow: true, sparkle: true, spin: rand() * Math.PI * 2, spinSpeed: (rand() - 0.5) * 6,
      });
    }
  }

  // ── WEAPONS / COMBAT — reload, raycast for laser, line-segment dist, laser tick, bullet firing ──
  function startReload(now) {
    player.reloading = true;
    player.reloadEndAt = now + player.reloadMs;
    sfxReload();
  }

  // Casts a ray from (x0,y0) along `angle`, up to maxRange, against both obstacles and the
  // world boundary. Returns { dist, type: 'obstacle'|'wall'|'none', nx, ny } where (nx,ny) is
  // the surface normal at the hit point — used both to stop the laser beam and, when PRISM has
  // Bullet Bounce stacks, to reflect it (mirrors how bullets bounce off the same two things).
  function raycastHit(x0, y0, angle, maxRange) {
    const dx = Math.cos(angle), dy = Math.sin(angle);
    let best = maxRange, type = 'none', nx = 0, ny = 0, hitObstacle = null;
    for (const ob of obstacles) {
      const ox = ob.x - x0, oy = ob.y - y0;
      const t = ox * dx + oy * dy;
      if (t < 0 || t > best) continue;
      const px = x0 + dx * t, py = y0 + dy * t;
      const dd = dist(px, py, ob.x, ob.y);
      if (dd < ob.r) {
        const back = Math.sqrt(Math.max(0, ob.r * ob.r - dd * dd));
        const hit = t - back;
        if (hit >= 0 && hit < best) {
          best = hit; type = 'obstacle'; hitObstacle = ob;
          const hx = x0 + dx * hit, hy = y0 + dy * hit;
          const ndx = hx - ob.x, ndy = hy - ob.y;
          const ndd = Math.sqrt(ndx * ndx + ndy * ndy) || 0.0001;
          nx = ndx / ndd; ny = ndy / ndd;
        }
      }
    }
    if (dx > 1e-6) { const t = (WORLD_W - x0) / dx; if (t >= 0 && t < best) { best = t; type = 'wall'; nx = -1; ny = 0; hitObstacle = null; } }
    else if (dx < -1e-6) { const t = (0 - x0) / dx; if (t >= 0 && t < best) { best = t; type = 'wall'; nx = 1; ny = 0; hitObstacle = null; } }
    if (dy > 1e-6) { const t = (WORLD_H - y0) / dy; if (t >= 0 && t < best) { best = t; type = 'wall'; nx = 0; ny = -1; hitObstacle = null; } }
    else if (dy < -1e-6) { const t = (0 - y0) / dy; if (t >= 0 && t < best) { best = t; type = 'wall'; nx = 0; ny = 1; hitObstacle = null; } }
    return { dist: best, type, nx, ny, hitObstacle };
  }

  function pointSegmentDist(px, py, ax, ay, bx, by) {
    const abx = bx - ax, aby = by - ay;
    const abLen2 = abx * abx + aby * aby;
    let t = abLen2 > 0 ? ((px - ax) * abx + (py - ay) * aby) / abLen2 : 0;
    t = Math.max(0, Math.min(1, t));
    return dist(px, py, ax + abx * t, ay + aby * t);
  }

  // PRISM's innate weapon: a continuous beam instead of discrete bullets. No ammo, no reload —
  // it just ticks damage into everything each segment touches, every frame it's held. With
  // Bullet Bounce stacks (player.bounceCount) the beam reflects off obstacles/walls, exactly
  // like a bounced bullet, instead of stopping dead — each stack allows one more reflection.
  function updateLaser(dt, now) {
    const cfg = CONFIG.weapons.laser;
    const totalRange = cfg.range + (player.bulletRangeBonus || 0);
    const halfW = (cfg.width * (player.laserWidthMult || 1)) / 2;
    const dmgMult = (player.bulletDamageMult || 1) * (player.laserDpsMult || 1);

    let x = player.x, y = player.y, angle = player.angle, remaining = totalRange;
    let bouncesLeft = player.bounceCount || 0;
    const segments = [];
    while (remaining > 0.5) {
      const hit = raycastHit(x, y, angle, remaining);
      const ex = x + Math.cos(angle) * hit.dist, ey = y + Math.sin(angle) * hit.dist;
      segments.push({ x1: x, y1: y, x2: ex, y2: ey });
      remaining -= hit.dist;
      // Keep the struck obstacle glowing for as long as the beam holds on it — refreshed every
      // frame the beam still touches it, so it fades out naturally once the beam moves off.
      if (hit.type === 'obstacle' && hit.hitObstacle) hit.hitObstacle.flashUntil = now + 150;
      if (hit.type === 'none' || bouncesLeft <= 0) break;
      bouncesLeft--;
      const dx = Math.cos(angle), dy = Math.sin(angle);
      const vn = dx * hit.nx + dy * hit.ny;
      const rdx = dx - 2 * vn * hit.nx, rdy = dy - 2 * vn * hit.ny;
      angle = Math.atan2(rdy, rdx);
      x = ex + hit.nx * 0.5; y = ey + hit.ny * 0.5; // nudge off the surface so it doesn't re-hit next segment
      // Throttled: this recomputes every frame the beam holds still on a bounce point, so an
      // unconditional spawn here would flood particles/shockwaves 60x/sec and tank the frame rate.
      if (rand() < 0.15) {
        addParticles(ex, ey, cfg.color, 3, 2.5, true); addShockwave(ex, ey, 14, cfg.color);
        // Bullet Bounce: bullets get a per-stack chance to refund a mag round on a ricochet
        // hit — the beam has no magazine, so the same chance instead refunds a slice of heat.
        const ricochetChance = Math.min(
          CONFIG.player.ricochetAmmoChanceCap,
          (player.bounceCount || 0) * CONFIG.player.ricochetAmmoChancePerStack
        );
        if (rand() < ricochetChance) {
          player.laserHeat = Math.min(cfg.maxHeat, player.laserHeat + cfg.maxHeat * 0.08);
          addParticles(ex, ey, '#7cfcff', 4, 2, true);
        }
      }
    }
    player.laserActive = true;
    player.laserSegments = segments;
    const last = segments[segments.length - 1];
    player.laserEndX = last.x2; player.laserEndY = last.y2;

    const hitThisFrame = new Set();
    for (const en of enemies) {
      if (hitThisFrame.has(en)) continue;
      let touched = false;
      for (const seg of segments) {
        if (pointSegmentDist(en.x, en.y, seg.x1, seg.y1, seg.x2, seg.y2) < halfW + en.r) { touched = true; break; }
      }
      if (!touched) continue;
      hitThisFrame.add(en);
      let dmg = cfg.dps * dt * dmgMult;
      const isCrit = rand() < (player.critChance || 0);
      if (isCrit) dmg *= 2.5;
      en.hp -= dmg;
      en.lastHitAt = now;
      en.flashUntil = now + 80;
      if (player.knockback) {
        // Enemy chase movement isn't itself dt-scaled (it advances a flat `en.speed` per
        // frame, calibrated for 60fps), so knockback needs the same *60 conversion from a
        // per-second rate — the previous *6 was ~10x too weak to ever push back a chasing
        // enemy, which is why Overcharge looked like it wasn't doing anything on the beam.
        const knockAng = Math.atan2(en.y - player.y, en.x - player.x);
        en.x += Math.cos(knockAng) * player.knockback * dt * 60;
        en.y += Math.sin(knockAng) * player.knockback * dt * 60;
      }
      if (player.laserLifestealPct) player.hp = Math.min(player.maxHp, player.hp + dmg * player.laserLifestealPct);
      if (rand() < 0.3) addParticles(en.x, en.y, cfg.color, isCrit ? 4 : 2, 2, true);
    }
  }

  function shootBullet(now) {
    if (player.weapon === 'laser') return; // laser damage is handled continuously by updateLaser
    if (player.reloading) return;
    if (player.magCurrent <= 0) { startReload(now); return; }
    const effFireRate = (now < player.overdriveUntil) ? player.fireRate * 0.5 : player.fireRate; // Overdrive Core: temp attack-speed buff
    if (now - lastShot < effFireRate) return;
    lastShot = now;
    if (prefs.flareOnShoot) player.flashUntil = now + 180;
    sfxShoot(player.weapon);
    player.magCurrent--;
    const isSpread = player.weapon === 'spread';
    const spreadCfg = CONFIG.weapons.spread;
    const baseCount = isSpread ? spreadCfg.count : 1;
    const extra = player.extraBullets || 0;
    const totalCount = baseCount + extra;
    const p = CONFIG.player;
    const bulletSpeed = p.bulletSpeed * (player.bulletSpeedMult || 1);
    const bulletR = Math.min(p.bulletMaxR, p.bulletR * (player.bulletSizeMult || 1));
    const angleStep = isSpread ? spreadCfg.spreadAngle : 0.12;
    const bulletColor = CONFIG.weapons[player.weapon].color;
    for (let i = 0; i < totalCount; i++) {
      const off = totalCount > 1 ? (i - (totalCount - 1) / 2) * angleStep : 0;
      const a = player.angle + off;
      bullets.push({
        x: player.x + Math.cos(a) * player.r, y: player.y + Math.sin(a) * player.r,
        vx: Math.cos(a) * bulletSpeed, vy: Math.sin(a) * bulletSpeed, r: bulletR,
        life: p.bulletLife + (player.bulletRangeBonus || 0),
        bounces: player.bounceCount || 0, pierce: player.pierceCount || 0,
        color: bulletColor,
      });
    }
    const m = CONFIG.particles.muzzle;
    addParticles(player.x + Math.cos(player.angle) * player.r, player.y + Math.sin(player.angle) * player.r,
                 bulletColor, m.n, m.speed, true);
    if (player.magCurrent <= 0) startReload(now);
  }

  // ── MAIN UPDATE LOOP — per-frame physics, collisions, spawns, state transitions ──
  function update(dt, now) {
    let mx = 0, my = 0;
    if (keyDown('KeyW', 'ArrowUp')) my -= 1;
    if (keyDown('KeyS', 'ArrowDown')) my += 1;
    if (keyDown('KeyA', 'ArrowLeft')) mx -= 1;
    if (keyDown('KeyD', 'ArrowRight')) mx += 1;
    if (moveStick.mag > 0.05) { mx = moveStick.dx; my = moveStick.dy; }
    const mag = Math.sqrt(mx * mx + my * my);

    // Firing intent, resolved up front so the laser weapon can lean on it below to slow
    // movement and cap turning — PRISM's beam is heavy to run-and-gun with.
    // On touch, the aim stick doubles as the fire trigger — but it used to fire the moment
    // it left its deadzone (mag > 0.15), the same threshold used for just tracking aim
    // angle below. That meant any attempt to point the stick also started firing, which is
    // especially rough on PRISM: firing caps how fast you can turn (see turnRateRad), so
    // you couldn't get the beam pointed before that same touch started limiting your turn
    // speed. Aiming (angle tracking) still reacts to the lightest touch past the deadzone;
    // firing now needs a firmer push toward the edge of the stick, so a light nudge just
    // aims and pushing further out commits to shooting — like a soft/hard analog trigger.
    // PRISM specifically no longer fires off the aim-stick push at all (only mouse/space/
    // the dedicated fire button trigger it), since a light push meant only to aim was still
    // prone to nudging past the threshold and starting the beam unintentionally.
    const AIM_FIRE_PUSH = 0.6;
    const isLaserWeapon = player.weapon === 'laser';
    const wantsFire = mouseDown || keyDown('Space') || (isLaserWeapon && fireBtnDown) || (!isLaserWeapon && aimStick.mag > AIM_FIRE_PUSH);
    const overdriveActive = now < player.overdriveUntil; // Overdrive Core pickup: temp overheat immunity + no heat drain
    if (overdriveActive) player.laserOverheated = false;
    const laserFiringThisFrame = wantsFire && isLaserWeapon && !player.laserOverheated;
    const lcfg = CONFIG.weapons.laser;

    if (mag > 0) {
      const moveSpeed = laserFiringThisFrame ? player.speed * lcfg.moveSpeedMult : player.speed;
      player.x += (mx / mag) * moveSpeed; player.y += (my / mag) * moveSpeed;
      playerTrail.push({ x: player.x, y: player.y, t: now });
      if (rand() < 0.6) {
        const tx = player.x - (mx / mag) * player.r * 0.8, ty = player.y - (my / mag) * player.r * 0.8;
        particles.push({
          x: tx, y: ty, vx: -(mx / mag) * 0.6 + (rand() - 0.5) * 0.5, vy: -(my / mag) * 0.6 + (rand() - 0.5) * 0.5,
          life: 0.5, size: rand() * 2 + 1, color: '#7cfcff', glow: true,
        });
      }
    }
    while (playerTrail.length && now - playerTrail[0].t > TRAIL_LIFE_MS) playerTrail.shift();
    resolveObstaclePush(player);
    player.x = Math.max(player.r, Math.min(WORLD_W - player.r, player.x));
    player.y = Math.max(player.r, Math.min(WORLD_H - player.r, player.y));

    // Nanite Regeneration: passive heal-over-time that only turns on after a stretch of not
    // getting hit, same delayed-regen shape the ghost bosses already use while fleeing.
    if (player.regenStacks && player.hp > 0 && player.hp < player.maxHp &&
        now - (player.lastDamagedAt || -Infinity) >= CONFIG.player.regenDelayMs) {
      player.hp = Math.min(player.maxHp, player.hp + CONFIG.player.regenHpPerSecPerStack * player.regenStacks * dt);
    }

    let targetAngle = player.angle;
    if (aimStick.mag > 0.15) {
      targetAngle = Math.atan2(aimStick.dy, aimStick.dx);
    } else if (mouse.active) {
      targetAngle = Math.atan2((mouse.y / zoom + cam.y) - player.y, (mouse.x / zoom + cam.x) - player.x);
    }
    if (laserFiringThisFrame) {
      // Cap turn rate while the beam is active — the aim eases toward the target instead of
      // snapping to it, so tracking fast-moving enemies while firing is noticeably harder.
      let diff = targetAngle - player.angle;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      const maxTurn = lcfg.turnRateRad * dt;
      player.angle += Math.max(-maxTurn, Math.min(maxTurn, diff));
    } else {
      player.angle = targetAngle;
    }

    // Beam heat: drains while actively firing, regenerates otherwise. Bottoming out forces an
    // overheat lockout that holds until heat climbs back past a partial-recharge threshold.
    // Coolant Injector stacks soften both rates; an active Overdrive Core suspends drain entirely.
    if (isLaserWeapon) {
      if (laserFiringThisFrame) {
        if (!overdriveActive) player.laserHeat -= lcfg.heatDrainPerSec * (player.laserHeatDrainMult || 1) * dt;
        if (player.laserHeat <= 0) { player.laserHeat = 0; if (!overdriveActive) player.laserOverheated = true; }
      } else {
        player.laserHeat = Math.min(lcfg.maxHeat, player.laserHeat + lcfg.heatRegenPerSec * (player.laserHeatRegenMult || 1) * dt);
        if (player.laserOverheated && player.laserHeat >= lcfg.overheatRegenThreshold) player.laserOverheated = false;
      }
    }

    let firing = wantsFire;
    if (laserFiringThisFrame) { updateLaser(dt, now); laserSfxStart(); }
    else {
      player.laserActive = false;
      laserSfxStop();
      if (firing && !isLaserWeapon) shootBullet(now);
    }

    if (player.weaponTimerMs > 0) {
      player.weaponTimerMs -= dt * 1000;
      if (player.weaponTimerMs <= 0) { player.weapon = player.defaultWeapon; player.fireRate = player.baseFireRate; }
    }

    if (player.reloading && now >= player.reloadEndAt) {
      player.reloading = false;
      player.magCurrent = player.magazineSize;
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx; b.y += b.vy; b.life--;
      if (rand() < 0.85) {
        particles.push({
          x: b.x - b.vx * 0.3, y: b.y - b.vy * 0.3, vx: -b.vx * 0.05, vy: -b.vy * 0.05,
          life: 1, lifeSpan: 0.35, size: b.r * 0.7, color: b.color || '#ffffff', glow: true,
        });
      }

      let hitEdge = false;
      if (b.x < 0) { b.x = 0; b.vx *= -1; hitEdge = true; }
      else if (b.x > WORLD_W) { b.x = WORLD_W; b.vx *= -1; hitEdge = true; }
      if (b.y < 0) { b.y = 0; b.vy *= -1; hitEdge = true; }
      else if (b.y > WORLD_H) { b.y = WORLD_H; b.vy *= -1; hitEdge = true; }

      if (hitEdge) {
        if ((b.bounces || 0) > 0) { b.bounces--; b.hasBounced = true; }
        else { bullets.splice(i, 1); continue; }
      }

      let hitObstacle = null, hitNx = 0, hitNy = 0;
      for (const ob of obstacles) {
        const ddx = b.x - ob.x, ddy = b.y - ob.y;
        const dd = Math.sqrt(ddx * ddx + ddy * ddy) || 0.0001;
        if (dd < ob.r + b.r) { hitObstacle = ob; hitNx = ddx / dd; hitNy = ddy / dd; break; }
      }
      if (hitObstacle) {
        hitObstacle.flashUntil = now + 180;
        if ((b.bounces || 0) > 0) {
          b.bounces--;
          b.hasBounced = true;
          const vn = b.vx * hitNx + b.vy * hitNy;
          b.vx -= 2 * vn * hitNx;
          b.vy -= 2 * vn * hitNy;
          // nudge the bullet just outside the obstacle so it doesn't re-trigger next frame
          b.x = hitObstacle.x + hitNx * (hitObstacle.r + b.r + 0.5);
          b.y = hitObstacle.y + hitNy * (hitObstacle.r + b.r + 0.5);
          addParticles(b.x, b.y, '#ffffff', 4, 2.5, true);
        } else {
          addParticles(b.x, b.y, '#ffd166', 4, 2.5, true);
          if ((b.pierce || 0) > 0) { b.pierce--; }
          else { bullets.splice(i, 1); continue; }
        }
      }

      if (b.life <= 0) bullets.splice(i, 1);
    }

    const pcfg = CONFIG.player;

    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      b.x += b.vx; b.y += b.vy; b.life--;
      let gone = false;

      if (b.x < -20 || b.x > WORLD_W + 20 || b.y < -20 || b.y > WORLD_H + 20) gone = true;

      if (!gone) {
        for (const ob of obstacles) {
          if (dist(b.x, b.y, ob.x, ob.y) < ob.r + b.r) { gone = true; ob.flashUntil = now + 180; addParticles(b.x, b.y, '#ffd166', 3, 2, true); break; }
        }
      }

      if (!gone && dist(b.x, b.y, player.x, player.y) < player.r + b.r) {
        let incoming = b.dmg;
        if (player.hp <= pcfg.lowHpThreshold) {
          const hpClamped = Math.max(1, player.hp);
          const t = (pcfg.lowHpThreshold - hpClamped) / (pcfg.lowHpThreshold - 1);
          const reduction = pcfg.lowHpMinReduction + t * (pcfg.lowHpMaxReduction - pcfg.lowHpMinReduction);
          incoming *= (1 - reduction);
        }
        if (player.dmgReduction) incoming *= (1 - player.dmgReduction);
        if (now < player.shieldInvulnUntil) {
          incoming = 0;
        } else if (player.shieldCharges > 0) {
          player.shieldCharges--;
          player.shieldInvulnUntil = now + 500;
          syncShieldStacks(player, player.shieldCharges);
          incoming = 0;
          addParticles(player.x, player.y, '#7cfcff', 10, 4, true);
          sfxShieldBlock();
        }
        if (incoming > 0) {
          player.hp -= incoming;
          player.lastDamagedAt = now;
          shake = Math.min(shake + CONFIG.shake.onHit, CONFIG.shake.onHitCap);
          addParticles(player.x, player.y, '#ffd166', 5, 3.5, true);
          flashHit(now);
        }
        gone = true;
      }

      if (gone || b.life <= 0) enemyBullets.splice(i, 1);
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const en = enemies[i];
      const a = Math.atan2(player.y - en.y, player.x - en.x);
      en.angle = a;

      if (en.type === 'sprinter') {
        const rc = CONFIG.enemy.sprinterRanged;
        const dToPlayer = dist(en.x, en.y, player.x, player.y);
        if (dToPlayer > rc.range + rc.slop) {
          // too far — close the gap (always allowed, even at tactics level 0)
          en.x += Math.cos(a) * en.speed;
          en.y += Math.sin(a) * en.speed;
        } else if (dToPlayer < rc.range - rc.slop) {
          // too close — back off, scaled by tactics: early sprinters don't dodge at all, just hold still
          en.x -= Math.cos(a) * en.speed * en.backoffMult;
          en.y -= Math.sin(a) * en.speed * en.backoffMult;
        } else {
          // in the pocket — strafe sideways while holding range, scaled by tactics
          en.x += Math.cos(a + Math.PI / 2) * en.speed * en.strafeMult * en.strafeDir;
          en.y += Math.sin(a + Math.PI / 2) * en.speed * en.strafeMult * en.strafeDir;
        }
        if (dToPlayer <= rc.range + rc.slop * 1.5 && now - en.lastShotAt >= en.fireRateMs) {
          en.lastShotAt = now;
          const mx = en.x + Math.cos(a) * en.r, my = en.y + Math.sin(a) * en.r;
          enemyBullets.push({
            x: mx, y: my, vx: Math.cos(a) * rc.bulletSpeed, vy: Math.sin(a) * rc.bulletSpeed,
            r: rc.bulletR, life: rc.bulletLife, dmg: rc.bulletDamage,
          });
          addParticles(mx, my, en.color, 4, 2.4, true);
        }
      } else if (en.type === 'ghost') {
        updateGhostMovement(en, now);
        if (en.wasRetreating) {
          // fleeing: regenerate fast, but only back up to 40% HP before rejoining the fight
          const fleeCap = en.maxHp * CONFIG.boss.fleeRegenCapFrac;
          if (en.hp < fleeCap) en.hp = Math.min(fleeCap, en.hp + en.maxHp * CONFIG.boss.fleeRegenPerSec * dt);
        } else if (en.hp < en.maxHp && now - en.lastHitAt >= CONFIG.boss.regenDelayMs) {
          en.hp = Math.min(en.maxHp, en.hp + en.maxHp * CONFIG.boss.regenPerSec * dt);
        }
        if (en.shooter) {
          const gs = CONFIG.boss.ghostShooter;
          if (now - en.lastShotAt >= gs.fireRateMs) {
            en.lastShotAt = now;
            const mx = en.x + Math.cos(a) * en.r, my = en.y + Math.sin(a) * en.r;
            enemyBullets.push({
              x: mx, y: my, vx: Math.cos(a) * gs.bulletSpeed, vy: Math.sin(a) * gs.bulletSpeed,
              r: gs.bulletR, life: gs.bulletLife, dmg: gs.bulletDamage,
            });
            addParticles(mx, my, en.color, 4, 2.4, true);
          }
        }
      } else if (en.type === 'sentinel') {
        updateSentinel(en, now, dt);
      } else {
        en.x += Math.cos(a) * en.speed;
        en.y += Math.sin(a) * en.speed;
      }
      if (en.type !== 'ghost' && en.type !== 'sentinel') resolveObstaclePush(en); // boss types drift straight through obstacles

      if (dist(en.x, en.y, player.x, player.y) < en.r + player.r) {
        let incoming = en.dmg * dt;
        if (player.hp <= pcfg.lowHpThreshold) {
          const hpClamped = Math.max(1, player.hp);
          const t = (pcfg.lowHpThreshold - hpClamped) / (pcfg.lowHpThreshold - 1);
          const reduction = pcfg.lowHpMinReduction + t * (pcfg.lowHpMaxReduction - pcfg.lowHpMinReduction);
          incoming *= (1 - reduction);
        }
        if (player.dmgReduction) incoming *= (1 - player.dmgReduction);
        if (now < player.shieldInvulnUntil) {
          incoming = 0;
        } else if (player.shieldCharges > 0) {
          player.shieldCharges--;
          player.shieldInvulnUntil = now + 500;
          syncShieldStacks(player, player.shieldCharges);
          incoming = 0;
          addParticles(player.x, player.y, '#7cfcff', 10, 4, true);
          sfxShieldBlock();
        }
        if (incoming > 0) {
          player.hp -= incoming;
          player.lastDamagedAt = now;
          shake = Math.min(shake + CONFIG.shake.onHit, CONFIG.shake.onHitCap);
          addParticles(player.x, player.y, '#ff4d4d', 4, 3);
          flashHit(now);
        }
      }

      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        if (dist(b.x, b.y, en.x, en.y) < en.r + b.r) {
          let dmg = CONFIG.enemy.bulletDamage * (player.bulletDamageMult || 1);
          const isCrit = rand() < (player.critChance || 0);
          if (isCrit) dmg *= 2.5;
          en.hp -= dmg;
          en.lastHitAt = now;
          en.flashUntil = now + 80;
          sfxEnemyHit(isCrit);

          if (player.knockback) {
            const knockAng = Math.atan2(en.y - player.y, en.x - player.x);
            en.x += Math.cos(knockAng) * player.knockback;
            en.y += Math.sin(knockAng) * player.knockback;
          }

          if (b.hasBounced && (player.bounceCount || 0) > 0 && !player.reloading && player.magCurrent < player.magazineSize) {
            const ricochetChance = Math.min(
              CONFIG.player.ricochetAmmoChanceCap,
              (player.bounceCount || 0) * CONFIG.player.ricochetAmmoChancePerStack
            );
            if (rand() < ricochetChance) {
              player.magCurrent = Math.min(player.magazineSize, player.magCurrent + 1);
              addParticles(b.x, b.y, '#7cfcff', 6, 3, true);
            }
          }

          if (player.explosiveChance && rand() < player.explosiveChance) {
            for (const other of enemies) {
              if (other === en) continue;
              if (dist(b.x, b.y, other.x, other.y) < pcfg.explosiveRadius) {
                other.hp -= dmg * 0.6;
                other.lastHitAt = now;
              }
            }
            addParticles(b.x, b.y, '#ffae42', 10, 3, true);
          }

          // core colored burst in the enemy's own color
          addParticles(b.x, b.y, en.color, CONFIG.particles.hitBurst.n * (isCrit ? 1.6 : 1), CONFIG.particles.hitBurst.speed, true);

          // bright directional sparks kicking back along the impact line
          const impactAngle = Math.atan2(b.y - en.y, b.x - en.x);
          const sparkCfg = CONFIG.particles.hitSpark;
          for (let k = 0; k < sparkCfg.n * (isCrit ? 1.8 : 1); k++) {
            const sAng = impactAngle + (rand() - 0.5) * 1.1;
            const sSpd = rand() * sparkCfg.speed + 1.5;
            particles.push({
              x: b.x, y: b.y, vx: Math.cos(sAng) * sSpd, vy: Math.sin(sAng) * sSpd,
              life: 1, size: rand() * (isCrit ? 1.8 : 1.2) + 0.6, color: isCrit ? '#fff6cf' : '#ffffff',
              twinkleFreq: rand() * 10 + 10, twinklePhase: rand() * Math.PI * 2, glow: true,
            });
          }

          // quick little impact ring, bigger and gold-tinted on a crit
          addShockwave(b.x, b.y, en.r * (isCrit ? 2.4 : 1.5), isCrit ? '#ffd166' : '#eafcff');
          shake = Math.min(shake + (isCrit ? 3 : 1.2), CONFIG.shake.onHitCap);

          if ((b.pierce || 0) > 0) { b.pierce--; } else { bullets.splice(j, 1); }
          break;
        }
      }

      if (player.thornDamage > 0 && dist(en.x, en.y, player.x, player.y) < (player.thornRadius + en.r)) {
        en.hp -= player.thornDamage * dt;
        en.lastHitAt = now;
      }
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const en = enemies[i];
      if (en.hp <= 0) {
        score += en.pts * combo;
        sfxEnemyKill();
        if (score > highScore) {
          if (!recordBrokenThisRun) { recordBrokenThisRun = true; triggerHighScoreCelebration(now, score); }
          highScore = score;
          saveHighScore(highScore);
        }
        combo = Math.min(combo + CONFIG.combo.gainPerKill, CONFIG.combo.max);
        comboTimer = CONFIG.combo.windowSec;
        addRainbowParticles(en.x, en.y, CONFIG.particles.killBurst.n, CONFIG.particles.killBurst.speed);
        addGlitterParticles(en.x, en.y, 14);
        shake = Math.min(shake + CONFIG.shake.onKill, CONFIG.shake.onKillCap);
        if (player.lifeSteal) player.hp = Math.min(player.maxHp, player.hp + player.lifeSteal);
        if (en.exp > 0 && orbs.length < CONFIG.pickup.maxAlive) {
          orbs.push({ x: en.x, y: en.y, r: CONFIG.pickup.orbR, exp: en.exp, type: 'exp', spin: rand() * Math.PI * 2 });
        }
        if (rand() < CONFIG.pickup.hpDropChance && orbs.length < CONFIG.pickup.maxAlive) {
          orbs.push({ x: en.x + (rand() - 0.5) * 14, y: en.y + (rand() - 0.5) * 14, r: CONFIG.pickup.hpOrbR, heal: CONFIG.pickup.hpHeal, type: 'hp', spin: rand() * Math.PI * 2 });
        }
        if (rand() < CONFIG.pickup.coreDropChance && orbs.length < CONFIG.pickup.maxAlive) {
          orbs.push({ x: en.x + (rand() - 0.5) * 14, y: en.y + (rand() - 0.5) * 14, r: CONFIG.pickup.coreOrbR, type: 'core', spin: rand() * Math.PI * 2 });
        }
        if (en.type === 'brute' && rand() < CONFIG.enemy.bruteExplodeChance) {
          triggerBruteExplosion(en.x, en.y, now);
        }
        enemies.splice(i, 1);
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94;
      if (p.gravity) p.vy += p.gravity;
      if (p.spinSpeed) p.spin += p.spinSpeed * dt;
      p.life -= dt * CONFIG.particles.fadeRate / (p.lifeSpan || 1);
      if (p.life <= 0) particles.splice(i, 1);
    }
    if (particles.length > CONFIG.particles.maxAlive) particles.splice(0, particles.length - CONFIG.particles.maxAlive);

    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const s = shockwaves[i];
      s.r += (s.maxR - s.r) * 0.18 + 1;
      s.alpha -= dt * 2.2;
      if (s.alpha <= 0 || s.r >= s.maxR + 4) shockwaves.splice(i, 1);
    }

    const pk = CONFIG.pickup;
    const magnetR = pk.baseMagnet + (player.magnetRadius || 0);
    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      const d = dist(o.x, o.y, player.x, player.y);
      if (d < player.r + o.r) {
        if (o.type === 'hp') {
          player.hp = Math.min(player.maxHp, player.hp + o.heal);
          addParticles(o.x, o.y, '#5cff9e', 10, 3, true);
          sfxPickup('hp');
        } else if (o.type === 'core') {
          // Overdrive Core: instant partial heat refill for PRISM (plus a brief overheat-immune,
          // no-drain window) or a temporary attack-speed buff for magazine weapons.
          const lc = CONFIG.weapons.laser;
          player.laserHeat = Math.min(lc.maxHeat, player.laserHeat + lc.maxHeat * CONFIG.pickup.coreHeatRestoreFrac);
          player.laserOverheated = false;
          player.overdriveUntil = now + CONFIG.pickup.coreOverdriveMs;
          addParticles(o.x, o.y, '#ffd166', 14, 4, true);
          addShockwave(o.x, o.y, 60, '#ffd166');
          sfxPickup('core');
        } else {
          player.exp += o.exp;
          addParticles(o.x, o.y, '#c65fff', 8, 3, true);
          sfxPickup('exp');
        }
        orbs.splice(i, 1);
        continue;
      }
      if (d < magnetR) {
        const t = 1 - Math.max(0, d - (player.r + o.r)) / magnetR;
        const speed = pk.pullSpeedMin + (pk.pullSpeedMax - pk.pullSpeedMin) * t;
        const ang = Math.atan2(player.y - o.y, player.x - o.x);
        o.x += Math.cos(ang) * speed;
        o.y += Math.sin(ang) * speed;
      }
    }

    if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 1; }
    if (shake > 0) shake *= CONFIG.shake.decay;

    if (enemies.length === 0) { wave++; spawnWave(); }
    if (player.hp <= 0) { phase = 'over'; laserSfxStop(); clearCheckpoint(); showGameOverOverlay(); }
    else if (player.exp >= player.expToNext) { triggerLevelUp(); }

    updateCamera();
  }

  // ── RENDERING — player/enemy sprite drawers, trail, laser beam, main render() ──
  function drawShip(x, y, angle, r, color) {
    const pts = [[r, 0], [-r * 0.7, r * 0.8], [-r * 0.3, 0], [-r * 0.7, -r * 0.8]];
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawPlayerSquare(x, y, angle, r, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = color;
    const s = r * 1.5;
    ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(s * 0.32, 0, s * 0.15, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawPlayerCircle(x, y, angle, r, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.05, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(angle);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(r * 0.55, 0, r * 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawPlayerDiamond(x, y, angle, r, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = color;
    const s = r * 1.35;
    ctx.beginPath();
    ctx.moveTo(s, 0);
    ctx.lineTo(0, -s * 0.72);
    ctx.lineTo(-s * 0.65, 0);
    ctx.lineTo(0, s * 0.72);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(s * 0.25, 0, s * 0.14, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // The beam itself: a soft outer glow, a bright core, and a hot white centerline.
  function drawLaserBeam(p) {
    if (!p.laserActive) return;
    const cfg = CONFIG.weapons.laser;
    const widthMult = p.laserWidthMult || 1;
    const segs = (p.laserSegments && p.laserSegments.length) ? p.laserSegments : [{ x1: p.x, y1: p.y, x2: p.laserEndX, y2: p.laserEndY }];
    const strokeAll = (width, color, alpha) => {
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      for (const s of segs) { ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); }
      ctx.stroke();
    };
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    strokeAll(cfg.width * widthMult * 2.4, cfg.color, 0.22);
    strokeAll(cfg.width * widthMult * 0.55, cfg.color, 0.85);
    strokeAll(cfg.width * widthMult * 0.2, '#ffffff', 1);
    ctx.restore();
  }

  function mixColorToWhite(hex, t) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    const nr = Math.round(r + (255 - r) * t), ng = Math.round(g + (255 - g) * t), nb = Math.round(b + (255 - b) * t);
    return `rgb(${nr},${ng},${nb})`;
  }

  // Light-cycle style energy ribbon: a glowing neon-purple trail that follows the player's
  // exact path, tapering thin and fading to nothing over TRAIL_LIFE_MS.
  function drawPlayerTrail(now) {
    const n = playerTrail.length;
    if (n < 2) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let i = 0; i < n - 1; i++) {
      const a = playerTrail[i], b = playerTrail[i + 1];
      const ageT = Math.max(0, Math.min(1, (now - b.t) / TRAIL_LIFE_MS)); // 0 = fresh (at player), 1 = about to vanish
      const fade = 1 - ageT;
      if (fade <= 0.02) continue;
      const width = player.r * (1.8 - ageT * 1.1);

      // soft outer glow pass
      ctx.strokeStyle = '#b84dff';
      ctx.globalAlpha = fade * fade * 0.11;
      ctx.lineWidth = Math.max(1, width * 1.4);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();

      // bright violet mid layer
      ctx.strokeStyle = '#d68cff';
      ctx.globalAlpha = fade * 0.18;
      ctx.lineWidth = Math.max(0.6, width * 0.55);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();

      // hot white-violet core, only near the fresh end for that energized look
      if (ageT < 0.4) {
        ctx.strokeStyle = '#f6e6ff';
        ctx.globalAlpha = fade * (1 - ageT / 0.4) * 0.2;
        ctx.lineWidth = Math.max(0.35, width * 0.2);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawPlayerAt(x, y, angle, r, player) {
    const baseColor = player.color || '#eafcff';
    const flashT = player.flashUntil ? Math.max(0, Math.min(1, (player.flashUntil - performance.now()) / 180)) : 0;
    if (flashT > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const halo = ctx.createRadialGradient(x, y, r * 0.2, x, y, r * 2.4);
      halo.addColorStop(0, '#ffffff');
      halo.addColorStop(0.5, baseColor);
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = 0.55 * flashT;
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(x, y, r * 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
    }
    // PRISM: a pulsing halo in the beam's own color while the laser is actively firing —
    // shifts to a hot red once heat runs low (unless Overdrive is masking it), so the glow
    // itself doubles as an at-a-glance overheat warning.
    if (player.laserActive) {
      const lc = CONFIG.weapons.laser;
      const heatFrac = (player.laserHeat != null) ? player.laserHeat / lc.maxHeat : 1;
      const overdriveOn = performance.now() < (player.overdriveUntil || 0);
      const hot = !overdriveOn && heatFrac < lc.lowHeatWarnFrac;
      const glowColor = hot ? '#ff4d4d' : lc.color;
      const pulse = 0.75 + 0.25 * Math.sin(performance.now() / 90);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const beamHalo = ctx.createRadialGradient(x, y, r * 0.3, x, y, r * 2.3);
      beamHalo.addColorStop(0, glowColor);
      beamHalo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = 0.5 * pulse;
      ctx.fillStyle = beamHalo;
      ctx.beginPath(); ctx.arc(x, y, r * 2.3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
    }
    const color = flashT > 0 ? mixColorToWhite(baseColor, flashT * 0.8) : baseColor;
    if (player.shape === 'square') drawPlayerSquare(x, y, angle, r, color);
    else if (player.shape === 'circle') drawPlayerCircle(x, y, angle, r, color);
    else if (player.shape === 'diamond') drawPlayerDiamond(x, y, angle, r, color);
    else drawShip(x, y, angle, r, color);
  }

  function drawEnemyCircle(x, y, angle, r, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(angle); // small directional notch so facing is still readable
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(r * 0.55, 0, r * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawGhost(x, y, angle, r, color, flashing) {
    ctx.save();
    ctx.translate(x, y);

    // soft ghostly halo
    ctx.globalCompositeOperation = 'lighter';
    const halo = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 1.9);
    halo.addColorStop(0, color);
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.9, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    // body: domed top, wavy skirt bottom — the classic ghost silhouette
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = flashing ? '#ffffff' : color;
    ctx.beginPath();
    ctx.arc(0, -r * 0.05, r, Math.PI, 0, false);
    ctx.lineTo(r, r * 0.7);
    const bumps = 4, bw = (r * 2) / bumps;
    for (let i = 0; i < bumps; i++) {
      const bx = r - bw * (i + 0.5);
      const dip = i % 2 === 0 ? r * 1.05 : r * 0.72;
      ctx.quadraticCurveTo(bx + bw * 0.25, dip, bx - bw * 0.25, r * 0.72);
    }
    ctx.lineTo(-r, r * 0.7);
    ctx.closePath();
    ctx.fill();

    // eyes, pupils tracking the given angle
    const eyeOffX = r * 0.42, eyeOffY = -r * 0.1, eyeR = r * 0.34;
    const pupilDX = Math.cos(angle) * eyeR * 0.4, pupilDY = Math.sin(angle) * eyeR * 0.4;
    for (const side of [-1, 1]) {
      ctx.fillStyle = '#eaf6ff';
      ctx.beginPath(); ctx.ellipse(side * eyeOffX, eyeOffY, eyeR * 0.72, eyeR, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.arc(side * eyeOffX + pupilDX, eyeOffY + pupilDY, eyeR * 0.42, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawSentinel(en, flashing) {
    const { x, y, r, rotation, enraged } = en;
    const coreColor = enraged ? '#ff4d4d' : en.color;
    ctx.save();
    ctx.translate(x, y);

    // outer halo, hotter and pulsing once enraged
    ctx.globalCompositeOperation = 'lighter';
    const pulse = 0.28 + 0.12 * Math.sin(performance.now() / (enraged ? 90 : 200));
    const halo = ctx.createRadialGradient(0, 0, r * 0.3, 0, 0, r * 2.4);
    halo.addColorStop(0, coreColor);
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = pulse;
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, 0, r * 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    // outer rotating hex shell
    ctx.save();
    ctx.rotate(rotation);
    ctx.strokeStyle = flashing ? '#ffffff' : coreColor;
    ctx.lineWidth = 4;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const ang = (Math.PI * 2 / 6) * i;
      const px = Math.cos(ang) * r, py = Math.sin(ang) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();

    // inner counter-rotating hex, smaller
    ctx.save();
    ctx.rotate(-rotation * 1.4);
    ctx.strokeStyle = flashing ? '#ffffff' : '#eaf6ff';
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const ang = (Math.PI * 2 / 6) * i;
      const px = Math.cos(ang) * r * 0.6, py = Math.sin(ang) * r * 0.6;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();

    // glowing core, brighter as it nears its next ring volley
    const readyT = en.nextRingAt - performance.now() < CONFIG.boss2.telegraphMs
      ? 1 - Math.max(0, en.nextRingAt - performance.now()) / CONFIG.boss2.telegraphMs
      : 0;
    ctx.fillStyle = flashing ? '#ffffff' : coreColor;
    ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(0, 0, r * (0.32 + readyT * 0.18), 0, Math.PI * 2); ctx.fill();

    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function render() {
    ctx.save();
    ctx.clearRect(0, 0, VW, VH);

    let shakeX = 0, shakeY = 0;
    if (shake > 0.3) { shakeX = (rand() - 0.5) * shake; shakeY = (rand() - 0.5) * shake; }
    ctx.translate(shakeX, shakeY);
    ctx.scale(zoom, zoom); // zoom out on smaller screens so more of the world is visible

    const bg = ctx.createLinearGradient(0, 0, 0, VVH);
    bg.addColorStop(0, '#10101c'); bg.addColorStop(1, '#050508');
    ctx.fillStyle = bg;
    ctx.fillRect(-40, -40, VVW + 80, VVH + 80);

    // Far background layer: parallax stars drift slower than the world (only a fraction of camera movement).
    ctx.save();
    ctx.translate(-cam.x * 0.6, -cam.y * 0.6);
    for (const s of farStars) {
      ctx.globalAlpha = s.baseAlpha;
      ctx.fillStyle = '#bfe8ff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    ctx.translate(-cam.x, -cam.y); // switch to world space

    // Soft drifting nebula clouds behind everything else.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const t = performance.now() / 1000;
    for (const n of nebulae) {
      const nx = n.x + Math.sin(t * 0.05 + n.phase) * n.driftX * 20;
      const ny = n.y + Math.cos(t * 0.04 + n.phase) * n.driftY * 20;
      const grad = ctx.createRadialGradient(nx, ny, 0, nx, ny, n.r);
      grad.addColorStop(0, n.color);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = n.alpha;
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(nx, ny, n.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    for (const s of stars) {
      const tw = 0.6 + 0.4 * Math.sin(performance.now() / 1000 * s.twinkleFreq + s.twinklePhase);
      ctx.globalAlpha = s.baseAlpha * tw;
      ctx.fillStyle = '#bfe8ff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.strokeStyle = 'rgba(90,200,255,0.06)'; ctx.lineWidth = 1;
    const gap = 48;
    const startX = Math.floor(cam.x / gap) * gap, startY = Math.floor(cam.y / gap) * gap;
    ctx.beginPath();
    for (let x = startX; x < cam.x + VVW + gap; x += gap) { ctx.moveTo(x, cam.y - gap); ctx.lineTo(x, cam.y + VVH + gap); }
    for (let y = startY; y < cam.y + VVH + gap; y += gap) { ctx.moveTo(cam.x - gap, y); ctx.lineTo(cam.x + VVW + gap, y); }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(124,252,255,0.28)'; ctx.lineWidth = 3;
    ctx.strokeRect(0, 0, WORLD_W, WORLD_H);

    for (const ob of obstacles) {
      const flashing = ob.flashUntil && performance.now() < ob.flashUntil;
      const flashT = flashing ? Math.max(0, (ob.flashUntil - performance.now()) / 180) : 0;
      ctx.save();
      ctx.translate(ob.x, ob.y);
      ctx.rotate(ob.rot);
      // soft glow halo — flares up brighter and wider right after a hit
      ctx.globalCompositeOperation = 'lighter';
      const haloR = ob.r * (1.6 + flashT * 0.9);
      const halo = ctx.createRadialGradient(0, 0, ob.r * 0.3, 0, 0, haloR);
      halo.addColorStop(0, flashing ? '#ffffff' : ob.color);
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = 0.22 + flashT * 0.55;
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(0, 0, haloR, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      // solid body — lightens toward white on impact
      ctx.beginPath();
      ctx.moveTo(ob.points[0][0], ob.points[0][1]);
      for (let i = 1; i < ob.points.length; i++) ctx.lineTo(ob.points[i][0], ob.points[i][1]);
      ctx.closePath();
      ctx.fillStyle = flashing ? `rgba(${13 + flashT * 200},${13 + flashT * 200},${22 + flashT * 220},1)` : '#0d0d16';
      ctx.fill();
      // impact "pop" on hit: a slightly thicker/brighter stroke instead of shadowBlur.
      // shadowBlur is a software-blur pass that's cheap on desktop Chrome's
      // GPU-accelerated canvas but very slow on many Android WebViews — a couple
      // of blurred obstacle strokes for ~180ms is enough to cause a visible stutter
      // on phones even though it's invisible on PC. The extra-wide halo above
      // already gives most of the "flash" look, so this is a plain stroke.
      ctx.lineWidth = 2.5 + flashT * 3.5;
      ctx.strokeStyle = flashing ? '#ffffff' : ob.color;
      ctx.stroke();
      // inner facet highlight
      ctx.beginPath();
      ctx.moveTo(0, 0);
      for (let i = 0; i < ob.points.length; i++) { ctx.lineTo(ob.points[i][0] * 0.55, ob.points[i][1] * 0.55); }
      ctx.strokeStyle = ob.color;
      ctx.globalAlpha = 0.25 + flashT * 0.4;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    if (phase === 'playing' || phase === 'paused' || phase === 'over' || phase === 'levelup') {
      ctx.globalCompositeOperation = 'lighter';
      for (const p of particles) {
        const twinkle = p.twinkleFreq ? 0.55 + 0.45 * Math.sin(p.life * p.twinkleFreq + (p.twinklePhase || 0)) : 1;
        const alpha = Math.max(0, Math.min(1, p.life)) * twinkle;
        if (alpha <= 0.02) continue;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        if (p.sparkle) {
          // 4-point glitter star instead of a plain dot
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.spin || 0);
          const r1 = p.size * 2.2, r2 = p.size * 0.5;
          ctx.beginPath();
          for (let k = 0; k < 8; k++) {
            const ang = (Math.PI / 4) * k;
            const rr = (k % 2 === 0) ? r1 : r2;
            const px = Math.cos(ang) * rr, py = Math.sin(ang) * rr;
            if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        } else {
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';

      ctx.globalCompositeOperation = 'lighter';
      for (const o of orbs) {
        const pulse = 0.7 + 0.3 * Math.sin(performance.now() / 180 + o.spin);
        const isHp = o.type === 'hp';
        const isCore = o.type === 'core';
        ctx.globalAlpha = 0.35 * pulse;
        ctx.fillStyle = isHp ? '#5cff9e' : (isCore ? '#ffd166' : '#c65fff');
        ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = isHp ? '#eafff0' : (isCore ? '#fff3d6' : '#f2d9ff');
        ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 0.7, 0, Math.PI * 2); ctx.fill();
        if (isHp) {
          ctx.fillStyle = '#0a3d24';
          ctx.fillRect(o.x - o.r * 0.55, o.y - o.r * 0.16, o.r * 1.1, o.r * 0.32);
          ctx.fillRect(o.x - o.r * 0.16, o.y - o.r * 0.55, o.r * 0.32, o.r * 1.1);
        } else if (isCore) {
          ctx.fillStyle = '#4a2f00';
          ctx.beginPath();
          ctx.moveTo(o.x + o.r * 0.12, o.y - o.r * 0.6);
          ctx.lineTo(o.x - o.r * 0.42, o.y + o.r * 0.08);
          ctx.lineTo(o.x - o.r * 0.02, o.y + o.r * 0.08);
          ctx.lineTo(o.x - o.r * 0.12, o.y + o.r * 0.6);
          ctx.lineTo(o.x + o.r * 0.42, o.y - o.r * 0.12);
          ctx.lineTo(o.x + o.r * 0.02, o.y - o.r * 0.12);
          ctx.closePath();
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';

      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.4;
      for (const b of bullets) {
        ctx.fillStyle = b.color || '#ffffff';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.1, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      for (const b of bullets) {
        ctx.fillStyle = b.color || '#ffffff';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      }

      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#ffd166';
      for (const b of enemyBullets) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2.4, 0, Math.PI * 2); ctx.fill(); }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#fff0c2';
      for (const b of enemyBullets) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); }

      for (const s of shockwaves) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, s.alpha);
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }

      for (const en of enemies) {
        const flashing = en.flashUntil && performance.now() < en.flashUntil;
        if (en.type === 'ghost') {
          drawGhost(en.x, en.y, en.angle, en.r, en.color, flashing);
        } else if (en.type === 'sentinel') {
          drawSentinel(en, flashing);
        } else {
          drawEnemyCircle(en.x, en.y, en.angle, en.r, flashing ? '#ffffff' : en.color);
        }
        if (en.hp < en.maxHp) {
          ctx.fillStyle = 'rgba(255,255,255,0.16)';
          ctx.fillRect(en.x - en.r, en.y - en.r - 10, en.r * 2, 4);
          ctx.fillStyle = '#5cff9e';
          ctx.fillRect(en.x - en.r, en.y - en.r - 10, en.r * 2 * (en.hp / en.maxHp), 4);
        }
      }

      if (player.thornRadius > 0) {
        ctx.save();
        ctx.globalAlpha = 0.16 + Math.sin(performance.now() / 220) * 0.05;
        ctx.strokeStyle = '#ff5fd6';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(player.x, player.y, player.thornRadius, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
      if (player.shieldCharges > 0) {
        ctx.save();
        ctx.strokeStyle = '#7cfcff';
        ctx.globalAlpha = 0.55;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 8, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }

      if (combo > 2) {
        ctx.save();
        const comboT = Math.min(1, (combo - 2) / (CONFIG.combo.max - 2));
        const hue = (performance.now() / 12) % 360;
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.18 + comboT * 0.22 + Math.sin(performance.now() / 150) * 0.05;
        ctx.strokeStyle = `hsl(${hue}, 100%, 65%)`;
        ctx.lineWidth = 2 + comboT * 3;
        ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 14 + comboT * 6, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }

      drawPlayerTrail(performance.now());
      drawLaserBeam(player);
      drawPlayerAt(player.x, player.y, player.angle, player.r + 4, player);
    }

    ctx.restore();

    if (bossActive && enemies.some(e => e.type === 'ghost')) {
      const now = performance.now();
      const intro = now < bossBannerUntil;
      ctx.save();
      const pulse = 0.7 + 0.3 * Math.sin(now / 260);
      ctx.textAlign = 'center';
      ctx.font = intro ? '800 30px "Segoe UI", sans-serif' : '800 15px "Segoe UI", sans-serif';
      ctx.fillStyle = '#ff5fd6';
      ctx.shadowColor = '#ff5fd6';
      ctx.shadowBlur = intro ? 22 : 12;
      ctx.globalAlpha = intro ? 1 : pulse;
      ctx.fillText('BOSS FIGHT — THE GHOST GANG', VW / 2, intro ? VH * 0.32 : 34);
      ctx.restore();
    } else if (bossActive && enemies.some(e => e.type === 'sentinel')) {
      const now = performance.now();
      const intro = now < bossBannerUntil;
      const sentinel = enemies.find(e => e.type === 'sentinel');
      ctx.save();
      const pulse = 0.7 + 0.3 * Math.sin(now / 260);
      ctx.textAlign = 'center';
      ctx.font = intro ? '800 30px "Segoe UI", sans-serif' : '800 15px "Segoe UI", sans-serif';
      ctx.fillStyle = sentinel && sentinel.enraged ? '#ff4d4d' : '#5fe0ff';
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = intro ? 22 : 12;
      ctx.globalAlpha = intro ? 1 : pulse;
      const label = sentinel && sentinel.enraged ? 'THE SENTINEL — OVERDRIVE' : `BOSS FIGHT — ${CONFIG.boss2.name}`;
      ctx.fillText(label, VW / 2, intro ? VH * 0.32 : 34);
      ctx.restore();
    }
  }

  // ── HUD — DOM text/bar updates each frame ──
  function updateHud() {
    scoreEl.textContent = Math.floor(score);
    comboEl.textContent = `x${combo.toFixed(1)} combo`;
    highScoreTagEl.textContent = `BEST ${Math.floor(highScore)}`;
    hpFillEl.style.width = (Math.max(0, player.hp) / player.maxHp * 100) + '%';
    waveEl.textContent = `WAVE ${wave}`;
    weaponTagEl.textContent = player.weapon;
    if (player.weapon === 'laser') fireBtn.classList.remove('hidden');
    else { fireBtn.classList.add('hidden'); if (fireBtnDown) setFireBtnDown(false); }
    levelEl.textContent = `LV ${player.level}`;
    expFillEl.style.width = Math.min(100, (player.exp / player.expToNext) * 100) + '%';
    if (player.weapon === 'laser') {
      const lc = CONFIG.weapons.laser;
      const heatPct = Math.round((player.laserHeat / lc.maxHeat) * 100);
      const overdriveOn = performance.now() < player.overdriveUntil;
      const lowHeat = !overdriveOn && !player.laserOverheated && (player.laserHeat / lc.maxHeat) < lc.lowHeatWarnFrac;
      if (player.laserOverheated) {
        ammoTagEl.textContent = `OVERHEATED ${heatPct}%`;
        ammoTagEl.classList.add('reloading');
        ammoTagEl.classList.remove('lowheat');
      } else {
        ammoTagEl.textContent = overdriveOn ? `BEAM ${heatPct}% — OVERDRIVE` : `BEAM ${heatPct}%`;
        ammoTagEl.classList.remove('reloading');
        ammoTagEl.classList.toggle('lowheat', lowHeat);
      }
    } else if (player.reloading) {
      const remain = Math.max(0, player.reloadEndAt - performance.now());
      ammoTagEl.textContent = `RELOADING… ${(remain / 1000).toFixed(1)}s`;
      ammoTagEl.classList.add('reloading');
      ammoTagEl.classList.remove('lowheat');
    } else {
      ammoTagEl.textContent = (performance.now() < player.overdriveUntil) ? `${player.magCurrent} / ${player.magazineSize} — OVERDRIVE` : `${player.magCurrent} / ${player.magazineSize}`;
      ammoTagEl.classList.remove('reloading');
      ammoTagEl.classList.remove('lowheat');
    }
    if (player.hp > 0 && player.hp <= CONFIG.player.lowHpThreshold) vignetteEl.classList.add('active');
    else vignetteEl.classList.remove('active');
    if (recordBannerHideAt && performance.now() > recordBannerHideAt) {
      recordBannerEl.classList.remove('active');
      recordBannerHideAt = 0;
    }
  }

  // ── GAME LOOP BOOTSTRAP — rAF loop + initial boot ──
  function loop(now) {
    const dt = Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;
    if (phase === 'playing') { update(dt, now); updateHud(); }
    render();
    requestAnimationFrame(loop);
  }

  showStartOverlay();
  requestAnimationFrame((t) => { lastFrame = t; requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
