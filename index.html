<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Neon Breach</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05050a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="screen-orientation" content="landscape">
<meta name="x5-orientation" content="landscape">
<meta name="full-screen" content="yes">
<meta name="x5-fullscreen" content="true">
<style>
:root{--cyan:#7cfcff;--cyan-dim:#4fd8e0;--pink:#ff5fd6;--amber:#ffd166;--red:#ff4d4d;--green:#5cff9e;--purple:#c65fff;--ink:#05050a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;touch-action:none}
#wrap{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}
canvas{display:block;width:100%;height:100%;background:#000}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;gap:10px;pointer-events:auto;touch-action:pan-y;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 0 48px;background:radial-gradient(ellipse at 50% 40%,rgba(20,20,40,0.35),rgba(0,0,0,0.55))}
#overlay.hidden{display:none}
#title{font-size:44px;font-weight:800;letter-spacing:4px;color:var(--cyan);text-shadow:0 0 18px rgba(124,252,255,0.55),0 0 40px rgba(124,252,255,0.25);margin:0}
#title.over{color:var(--red);text-shadow:0 0 18px rgba(255,77,77,0.55),0 0 40px rgba(255,77,77,0.25)}
#stats{color:#e6f5ff;font-size:16px;opacity:0.9}
#startBtn{pointer-events:auto;margin-top:14px;font-family:inherit;font-size:16px;font-weight:700;letter-spacing:2px;padding:13px 38px;border-radius:6px;border:none;cursor:pointer;background:var(--cyan);color:#000;box-shadow:0 0 24px rgba(0,224,255,0.45);transition:transform .12s ease,box-shadow .12s ease}
#startBtn:active{transform:scale(0.96);box-shadow:0 0 10px rgba(0,224,255,0.35)}
#startRow{pointer-events:auto;display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;justify-content:center}
#startRow #startBtn{margin-top:0}
#continueBtn{pointer-events:auto;font-family:inherit;font-size:16px;font-weight:700;letter-spacing:2px;padding:13px 34px;border-radius:6px;cursor:pointer;background:transparent;color:var(--pink);border:2px solid var(--pink);box-shadow:0 0 18px rgba(255,95,214,0.3);transition:transform .12s ease,box-shadow .12s ease}
#continueBtn:active{transform:scale(0.96);box-shadow:0 0 8px rgba(255,95,214,0.25)}
#continueBtn.hidden{display:none}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at 50% 50%,rgba(255,0,0,0) 55%,rgba(255,0,0,0.4) 100%);opacity:0;transition:opacity .3s ease}
#vignette.active{opacity:1;animation:vignettePulse 1.1s ease-in-out infinite}
@keyframes vignettePulse{0%,100%{opacity:.55}50%{opacity:1}}
#hitFlash{position:fixed;inset:0;pointer-events:none;z-index:6;background:rgba(255,40,40,0);transition:background .3s ease}
#hud{position:fixed;inset:0;pointer-events:none;font-family:inherit}
#hud.hidden{display:none}
#score{position:absolute;top:14px;left:20px;font-size:26px;font-weight:800;color:var(--cyan);text-shadow:0 0 10px rgba(124,252,255,0.5)}
#combo{position:absolute;top:48px;left:22px;font-size:12px;color:var(--pink);font-weight:600}
#highScoreTag{position:absolute;top:74px;right:20px;font-size:13px;font-weight:700;letter-spacing:1px;color:var(--amber);text-shadow:0 0 8px rgba(255,209,102,0.4);text-align:right}
#recordBanner{position:fixed;top:16%;left:50%;transform:translate(-50%,-30px);z-index:8;pointer-events:none;text-align:center;opacity:0;transition:opacity .35s ease,transform .35s ease}
#recordBanner.active{opacity:1;transform:translate(-50%,0)}
#recordBannerTitle{font-size:34px;font-weight:800;letter-spacing:4px;color:var(--amber);text-shadow:0 0 18px rgba(255,209,102,0.7),0 0 44px rgba(255,209,102,0.4);animation:recordPulse 1s ease-in-out infinite}
#recordBannerSub{margin-top:6px;font-size:14px;font-weight:700;letter-spacing:1px;color:#fff2cf;opacity:0.9}
@keyframes recordPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (max-width:600px){
  #recordBannerTitle{font-size:24px}
  #recordBannerSub{font-size:11px}
}
#hpBarBack{position:absolute;top:70px;left:20px;width:220px;height:14px;border:2px solid var(--cyan-dim);border-radius:3px;overflow:hidden;background:rgba(0,0,0,0.3)}
#hpBarFill{height:100%;width:100%;background:linear-gradient(90deg,#00ffb0,var(--cyan-dim));transition:width .12s linear}
#levelTag{position:absolute;top:70px;left:250px;font-size:13px;font-weight:800;color:var(--amber);letter-spacing:1px;text-shadow:0 0 8px rgba(255,209,102,0.5)}
#expBarBack{position:absolute;top:88px;left:20px;width:220px;height:6px;border:1px solid rgba(198,95,255,0.55);border-radius:3px;overflow:hidden;background:rgba(0,0,0,0.3)}
#expBarFill{height:100%;width:0%;background:linear-gradient(90deg,var(--purple),var(--pink));transition:width .12s linear}
#wave{position:absolute;top:54px;right:20px;font-size:13px;font-weight:700;color:var(--amber);letter-spacing:1px}
#weaponTag{position:absolute;top:104px;left:20px;font-size:11px;font-weight:600;letter-spacing:1px;color:#c6f5ff;opacity:0.8;text-transform:uppercase}
#ammoTag{position:absolute;top:122px;left:20px;font-size:12px;font-weight:700;letter-spacing:0.5px;color:var(--cyan);opacity:0.9;font-variant-numeric:tabular-nums;transition:color .15s ease}
#ammoTag.reloading{color:var(--amber)}
#ammoTag.lowheat{color:var(--red);animation:lowHeatPulse .5s ease-in-out infinite}
@keyframes lowHeatPulse{0%,100%{opacity:1}50%{opacity:.45}}
#pauseBtn{position:absolute;top:16px;right:20px;pointer-events:auto;cursor:pointer;width:38px;height:38px;border-radius:8px;border:2px solid var(--cyan-dim);background:rgba(5,5,10,0.55);color:var(--cyan);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(124,252,255,0.2)}
#pauseBtn:active{transform:scale(0.94)}
#fireBtn{position:absolute;top:150px;left:210px;pointer-events:auto;cursor:pointer;width:78px;height:78px;border-radius:50%;border:2px solid var(--pink);background:rgba(255,95,214,0.16);color:var(--pink);display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(255,95,214,0.35);touch-action:none;transition:background .1s ease,box-shadow .1s ease,transform .1s ease}
#fireBtn svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:2;filter:drop-shadow(0 0 4px currentColor)}
#fireBtn.active{background:rgba(255,95,214,0.5);box-shadow:0 0 26px rgba(255,95,214,0.7);transform:scale(0.94)}
#fireBtn.hidden{display:none}
@media (min-width:900px){
  #fireBtn{display:none}
}
#controls{position:fixed;inset:0;pointer-events:none}
#controls.hidden{display:none}
.stick-zone{position:absolute;bottom:26px;width:150px;height:150px;border-radius:50%;pointer-events:auto;touch-action:none}
#aimZone{width:170px;height:170px}
#moveZone{left:26px}
#aimZone{right:26px}
.stick-base{position:absolute;inset:0;border-radius:50%;background:transparent;border:none;box-shadow:none}
.stick-knob{position:absolute;width:62px;height:62px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);background:transparent;box-shadow:none;transition:background .08s ease,box-shadow .08s ease}
.stick-knob.firing{background:rgba(255,95,214,0.28);box-shadow:0 0 18px rgba(255,95,214,0.55)}
.stick-label{display:none}
@media (min-width:900px){
  .stick-zone{display:none}
}
@media (pointer:coarse){
  .stick-zone{display:block}
}
#charSelect{pointer-events:auto;margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:10px}
#settingsSection{pointer-events:auto;margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
#settingsLabel{font-size:12px;letter-spacing:3px;color:#9fd8e0;opacity:0.85}
.toggle-row{display:flex;align-items:center;gap:9px;cursor:pointer;color:#cfe9ee;font-size:13px;padding:8px 16px;border:1px solid rgba(124,252,255,0.3);border-radius:8px;background:rgba(10,14,26,0.6);transition:border-color .12s ease,box-shadow .12s ease}
.toggle-row:hover{border-color:var(--cyan-dim);box-shadow:0 0 12px rgba(124,252,255,0.15)}
.toggle-row input{width:16px;height:16px;accent-color:var(--pink);cursor:pointer}
#charSelectLabel{font-size:12px;letter-spacing:3px;color:#9fd8e0;opacity:0.85}
#charCards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
#skinSection{pointer-events:auto;margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
#skinLabel{font-size:11px;letter-spacing:3px;color:#9fd8e0;opacity:0.85}
#skinSwatches{display:flex;gap:11px;flex-wrap:wrap;justify-content:center}
.skin-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,0.22);box-shadow:0 0 8px rgba(255,255,255,0.12);transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}
.skin-swatch:hover{transform:scale(1.12)}
.skin-swatch.selected{border-color:#fff;box-shadow:0 0 16px currentColor,0 0 4px #fff}
.char-card{width:130px;min-height:150px;border:2px solid var(--cyan-dim);border-radius:10px;background:rgba(10,14,26,0.78);padding:14px 10px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;box-shadow:0 0 14px rgba(124,252,255,0.12)}
.char-card:hover{transform:translateY(-3px)}
.char-card.selected{border-color:var(--pink);box-shadow:0 0 26px rgba(255,95,214,0.4)}
.char-icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.char-icon svg{width:100%;height:100%;filter:drop-shadow(0 0 6px currentColor)}
.char-name{font-size:13px;font-weight:800;letter-spacing:0.5px}
.char-desc{font-size:11px;color:#cfe9ee;opacity:0.9;line-height:1.35}
@media (max-width:600px){
  .char-card{width:27vw;min-height:130px;padding:10px 6px}
  .char-desc{font-size:10px}
}
#levelupOverlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(20,10,40,0.55),rgba(0,0,0,0.8));pointer-events:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:20px 0}
#levelupOverlay.hidden{display:none}
#levelupPanel{text-align:center;max-width:900px;padding:0 20px}
#levelupTitle{font-size:36px;font-weight:800;letter-spacing:4px;color:var(--purple);margin:0 0 6px;text-shadow:0 0 18px rgba(198,95,255,0.6),0 0 40px rgba(198,95,255,0.3);animation:levelupHue 3s linear infinite}
@keyframes levelupHue{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
#levelupSub{color:#e6f5ff;font-size:14px;opacity:0.85;margin-bottom:22px}
#levelupCards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.levelup-card{width:220px;min-height:150px;border:2px solid var(--cyan-dim);border-radius:10px;background:rgba(10,14,26,0.78);padding:18px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;box-shadow:0 0 14px rgba(124,252,255,0.12)}
.levelup-card:hover,.levelup-card:active{transform:translateY(-4px) scale(1.03);border-color:var(--pink);box-shadow:0 0 26px rgba(255,95,214,0.35)}
.lu-name{font-size:15px;font-weight:800;color:var(--cyan);letter-spacing:0.5px}
.lu-desc{font-size:12.5px;color:#cfe9ee;opacity:0.9;line-height:1.4}
@media (max-width:600px){
  .levelup-card{width:44vw;min-height:130px;padding:14px 10px}
  #levelupTitle{font-size:26px}
}
#pauseOverlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(10,20,40,0.55),rgba(0,0,0,0.8));pointer-events:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:20px 0}
#pauseOverlay.hidden{display:none}
#pausePanel{text-align:center}
#pauseTitle{font-size:36px;font-weight:800;letter-spacing:6px;color:var(--cyan);margin:0 0 8px;text-shadow:0 0 18px rgba(124,252,255,0.6),0 0 40px rgba(124,252,255,0.3)}
#pauseStats{color:#e6f5ff;font-size:14px;opacity:0.85;margin-bottom:22px}
#pauseRow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
#resumeBtn,#quitBtn{font-family:inherit;font-size:16px;font-weight:700;letter-spacing:2px;padding:13px 34px;border-radius:6px;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
#resumeBtn{border:none;background:var(--cyan);color:#000;box-shadow:0 0 24px rgba(0,224,255,0.45)}
#resumeBtn:active{transform:scale(0.96);box-shadow:0 0 10px rgba(0,224,255,0.35)}
#quitBtn{background:transparent;color:var(--red);border:2px solid var(--red);box-shadow:0 0 18px rgba(255,77,77,0.25)}
#quitBtn:active{transform:scale(0.96);box-shadow:0 0 8px rgba(255,77,77,0.2)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="vignette"></div>
  <div id="hitFlash"></div>

  <div id="hud" class="hidden">
    <div id="score">0</div>
    <div id="combo">x1.0 combo</div>
    <div id="highScoreTag">BEST 0</div>
    <div id="hpBarBack"><div id="hpBarFill"></div></div>
    <div id="levelTag">LV 1</div>
    <div id="expBarBack"><div id="expBarFill"></div></div>
    <div id="weaponTag">basic</div>
    <div id="ammoTag">15 / 15</div>
    <div id="wave">WAVE 1</div>
    <button id="pauseBtn" aria-label="Pause">❚❚</button>
    <button id="fireBtn" class="hidden" aria-label="Fire">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"></circle><line x1="12" y1="2" x2="12" y2="7"></line><line x1="12" y1="17" x2="12" y2="22"></line><line x1="2" y1="12" x2="7" y2="12"></line><line x1="17" y1="12" x2="22" y2="12"></line></svg>
    </button>
  </div>

  <div id="recordBanner">
    <div id="recordBannerTitle">NEW HIGH SCORE!</div>
    <div id="recordBannerSub"></div>
  </div>

  <div id="controls" class="hidden">
    <div id="moveZone" class="stick-zone">
      <div class="stick-base"></div>
      <div class="stick-knob" id="moveKnob"></div>
      <div class="stick-label">MOVE</div>
    </div>
    <div id="aimZone" class="stick-zone">
      <div class="stick-base"></div>
      <div class="stick-knob" id="aimKnob"></div>
      <div class="stick-label">AIM / FIRE</div>
    </div>
  </div>

  <div id="overlay">
    <h1 id="title">NEON BREACH</h1>
    <div id="stats"></div>
    <div id="charSelect">
      <div id="charSelectLabel">CHOOSE YOUR UNIT</div>
      <div id="charCards"></div>
    </div>
    <div id="skinSection">
      <div id="skinLabel">SKIN</div>
      <div id="skinSwatches"></div>
    </div>
    <div id="settingsSection">
      <div id="settingsLabel">PREFERENCES</div>
      <label class="toggle-row" for="soundToggle">
        <input type="checkbox" id="soundToggle" checked>
        <span>Sound effects</span>
      </label>
      <label class="toggle-row" for="flareToggle">
        <input type="checkbox" id="flareToggle" checked>
        <span>Character flare on shoot</span>
      </label>
    </div>
    <div id="startRow">
      <button id="startBtn">START</button>
      <button id="continueBtn" class="hidden">CONTINUE</button>
    </div>
  </div>

  <div id="levelupOverlay" class="hidden">
    <div id="levelupPanel">
      <h2 id="levelupTitle">LEVEL UP!</h2>
      <div id="levelupSub">Choose a bonus</div>
      <div id="levelupCards"></div>
    </div>
  </div>

  <div id="pauseOverlay" class="hidden">
    <div id="pausePanel">
      <h2 id="pauseTitle">PAUSED</h2>
      <div id="pauseStats"></div>
      <div id="pauseRow">
        <button id="resumeBtn">RESUME</button>
        <button id="quitBtn">QUIT</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  // ============================================================
  // NEON BREACH — top-down survival shooter, single-file canvas game
  // Section map (search for the "── TITLE ──" banners below):
  //   CONFIG — tunable constants: world size, player/weapon/enemy stats, waves, bosses, skills
  //   PREFS — localStorage settings (audio/vibration/etc toggles)
  //   CANVAS / VIEWPORT — sizing, DPR, camera zoom
  //   MATH & OBSTACLE UTILS — distance, obstacle shape gen, collision push-out
  //   SCREEN FX HELPERS — hit flash, shockwave rings
  //   PLAYER — leveling curve, player factory, shield-stack sync
  //   CHECKPOINT / SAVE SYSTEM — mid-run save/load/clear to localStorage
  //   INPUT — keyboard, virtual joysticks (touch), camera follow
  //   CHARACTER SELECT UI — icon svg + card builder
  //   GAME FLOW — menu/start/continue/pause/resume/quit, overlay show/hide, run reset
  //   LEVEL-UP / SKILL CHOICE SYSTEM — offer, render, apply picked skill
  //   ENEMY SPAWNING & AI — wave/boss spawns, sentinel + ghost behavior, enemy factory
  //   PARTICLE EFFECTS — hit sparks, explosions, rainbow/glitter bursts
  //   WEAPONS / COMBAT — reload, raycast for laser, line-segment dist, laser tick, bullet firing
  //   MAIN UPDATE LOOP — per-frame physics, collisions, spawns, state transitions
  //   RENDERING — player/enemy sprite drawers, trail, laser beam, main render()
  //   HUD — DOM text/bar updates each frame
  //   GAME LOOP BOOTSTRAP — rAF loop + initial boot
  // ============================================================

  // ── CONFIG — tunable constants: world size, player/weapon/enemy stats, waves, bosses, skills ──
  const CONFIG = {
    world: { w: 3200, h: 2200 },
    player: {
      r: 14, hp: 100, speed: 4.4, fireRate: 165,
      lowHpThreshold: 20,      // at/below this hp, player takes reduced dmg
      lowHpMinReduction: 0.50, // reduction at threshold hp
      lowHpMaxReduction: 0.90, // reduction as hp approaches 1
      bulletSpeed: 10, bulletR: 4, bulletMaxR: 9, bulletLife: 60,
      regenDelayMs: 4000,      // Nanite Regeneration: must go this long without taking damage before it kicks in
      regenHpPerSecPerStack: 1.5, // Nanite Regeneration: max HP restored per second, per stack
      shieldMaxStacks: 5,       // Shield Generator: hard cap on stacked charges
      shieldSpeedPerStack: 0.20,   // +movement speed per active shield stack
      shieldDmgPerStack: 0.20,     // +bullet damage per active shield stack
      shieldAtkSpeedPerStack: 0.05,// +attack speed per active shield stack
      ricochetAmmoChancePerStack: 0.10, // Bullet Bounce: chance a ricocheted bullet refunds 1 mag round on enemy hit, per stack
      ricochetAmmoChanceCap: 0.50,      // hard cap on that chance (reached at 5 stacks)
      explosiveRadius: 70,     // Explosive Impact: AOE blast radius
      magazineSize: 15,        // bullets per magazine before a reload is forced
      reloadMs: 1500,          // time to fully reload
      reloadMinMs: 350,        // floor so Reload Speed skill can't reach 0
    },
    weapons: {
      basic:  { fireRate: 165, color: '#bff3ff' },
      rapid:  { fireRate: 70,  durationMs: 6000, color: '#ffd166' },
      spread: { fireRate: 190, durationMs: 7000, count: 3, spreadAngle: 0.28, color: '#ff5fd6' },
      laser:  { color: '#eaff4d', dps: 42, range: 300, width: 10, // continuous piercing beam, no ammo/reload
        maxHeat: 100, heatDrainPerSec: 34, heatRegenPerSec: 26, overheatRegenThreshold: 32, // heat limit: ~2.9s of continuous fire before forced shutoff
        lowHeatWarnFrac: 0.25, // HUD pulses amber once heat drops below this fraction
        turnRateRad: Math.PI * 0.32, // max radians/sec the aim can turn while the beam is firing (hard to turn while shooting)
        moveSpeedMult: 0.5, // movement speed multiplier while firing AND moving
      },
    },
    enemy: {
      bulletDamage: 12,
      hpScalePerWave: 0.15, // enemy max HP compounds by this fraction every wave
      types: {
        grunt:    { r: 16, speed: 1.652, hp: 20, dmg: 10, pts: 10, exp: 8,  color: '#ff5f7a' },
        sprinter: { r: 11, speed: 2.97,  hp: 12, dmg: 8,  pts: 16, exp: 10, color: '#ffd166' },
        brute:    { r: 26, speed: 1.029, hp: 84, dmg: 22, pts: 40, exp: 25, color: '#c65fff' },
        ghost:    { r: 19, speed: 1.68,  hp: 560, dmg: 16, pts: 450, exp: 200, color: '#ffffff' },
        sentinel: { r: 34, speed: 1.35, hp: 2600, dmg: 24, pts: 900, exp: 500, color: '#5fe0ff' },
      },
      sprinterMinWave: 2, sprinterRoll: 0.6,
      bruteMinWave: 3, bruteRoll: 0.85,
      bruteExplodeChance: 0.10,  // chance a dying brute detonates
      bruteExplodeRadius: 90,    // AOE blast radius
      bruteExplodeDamage: 25,    // damage dealt to player/enemies caught in the blast
      sprinterRanged: {          // sprinters kite the player and shoot instead of rushing in
        range: 160,             // preferred standoff distance
        slop: 24,               // hysteresis band around range so it doesn't jitter in/out
        fireRateMsEarly: 2100,  // sluggish fire rate for a brand-new sprinter (wave sprinterMinWave)
        fireRateMsCap: 850,     // fastest fire rate once fully scaled up
        bulletSpeed: 6.2,
        bulletR: 4,

  // ── AUDIO — lightweight synthesized SFX (Web Audio API oscillators/noise, no external
  // assets to load). Gated by prefs.sound. The AudioContext is created lazily on the first

  let actx = null, masterGain = null, noiseBuffer = null;
  function ensureAudio() {
    if (actx) return actx;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = actx.createGain();
      masterGain.gain.value = 0.45;
      masterGain.connect(actx.destination);

    const c = ensureAudio();

  function getNoiseBuffer() {
    if (noiseBuffer) return noiseBuffer;
    const size = actx.sampleRate * 0.5;
    noiseBuffer = actx.createBuffer(1, size, actx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;
    return noiseBuffer;
  }
  // Short tone with a fast attack + exponential decay, optionally sliding pitch — covers
  // shots, blips, pings, and the ascending/descending stings used for level-ups etc.
  function sfxTone({ freq = 440, freqEnd = null, dur = 0.09, type = 'square', vol = 0.18, attack = 0.004, delay = 0 }) {
    if (!prefs.sound || !ensureAudio()) return;
    if (actx.state === 'suspended') actx.resume().catch(() => {});
    const t0 = actx.currentTime + delay;
    const osc = actx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(1, freq), t0);
    if (freqEnd !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(masterGain);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }

    if (!prefs.sound || !ensureAudio()) return;

    const t0 = actx.currentTime + delay;
    const src = actx.createBufferSource();
    src.buffer = getNoiseBuffer();
    const filter = actx.createBiquadFilter();
    filter.type = type; filter.frequency.value = freq; filter.Q.value = q;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filter); filter.connect(g); g.connect(masterGain);
    src.start(t0); src.stop(t0 + dur + 0.02);
  }

  let laserOsc = null, laserLfo = null, laserGain = null;
  function laserSfxStart() {
    if (!prefs.sound || !ensureAudio() || laserOsc) return;
    if (actx.state === 'suspended') actx.resume().catch(() => {});
    const t0 = actx.currentTime;
    laserOsc = actx.createOscillator();
    laserOsc.type = 'sawtooth';
    laserOsc.frequency.value = 180;
    laserLfo = actx.createOscillator();

    laserGain.gain.setValueAtTime(0.0001, t0);

    laserOsc.connect(filter); filter.connect(laserGain); laserGain.connect(masterGain);

  let VW = window.innerWidth, VH = window.innerHeight; // viewport (screen) size
  // Game-world "vision": on a big PC window the player naturally sees more of the
  // world than on a small phone screen, since the camera always shows exactly
  // VW x VH world units. `zoom` compensates for that — on narrower screens we zoom
  // the camera out so the visible world area (VVW x VVH) approaches what a normal
  // desktop window would show, instead of shrinking with the screen.
  let zoom = 1, VVW = VW, VVH = VH;
  const ZOOM_REF_W = 1100;   // screen width at/above which vision matches "PC" (zoom stays 1)
  const ZOOM_MIN = 0.25;     // don't zoom out past this even on tiny phones
  // ── CANVAS / VIEWPORT — sizing, DPR, camera zoom ──
  function resize() {
    // visualViewport reflects the actual visible area on mobile (accounts for browser
    // chrome / on-screen keyboard) more reliably than innerWidth/innerHeight alone.
    const vv = window.visualViewport;
    VW = Math.round(vv ? vv.width : window.innerWidth);
    VH = Math.round(vv ? vv.height : window.innerHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = VW * dpr; canvas.height = VH * dpr;
    canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    zoom = Math.max(ZOOM_MIN, Math.min(1, VW / ZOOM_REF_W));
    VVW = VW / zoom; VVH = VH / zoom; // visible world-space size at current zoom
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  // On mobile, innerWidth/innerHeight (and visualViewport) can report stale values for a
  // moment right after a rotation, so re-run resize a couple times as it settles.
  window.addEventListener('orientationchange', () => {
    resize();
    setTimeout(resize, 120);
    setTimeout(resize, 400);
  });
  resize();

  // ── FULLSCREEN + ORIENTATION LOCK — best effort, must run from a user gesture ──
  // Wrapped defensively: on some mobile/in-app browsers these APIs throw synchronously
  // instead of rejecting a promise (against spec), which would otherwise abort the click
  // handler and silently block startGame()/continueGame() from ever running.
  function enterImmersiveMode() {
    try {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      const doLockOrientation = () => {
        try {
          if (screen.orientation && screen.orientation.lock) {
            const p = screen.orientation.lock('landscape');
            if (p && p.catch) p.catch(() => {});
          }
        } catch (e) { /* orientation lock unsupported/blocked here — ignore */ }
      };
      if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
        try {
          const result = req.call(el);
          if (result && result.then) result.then(doLockOrientation).catch(() => {});
          else doLockOrientation();
        } catch (e) { /* fullscreen not permitted here (e.g. iOS Safari) — ignore */ }
      } else {
        doLockOrientation();
      }
      setTimeout(resize, 150);
    } catch (e) { /* never let this block the caller from starting the game */ }
  }

  document.addEventListener('webkitfullscreenchange', resize);
  // Fullscreen + orientation lock both require a user gesture, so the menu can't be
  // forced sideways before any touch happens — but we don't need to wait specifically
  // for the Start button either. Flip to landscape on the very first tap/click anywhere
  // on the page, so the menu itself goes sideways immediately instead of staying
  // portrait until Start is pressed.
  document.addEventListener('pointerdown', enterImmersiveMode, { once: true, capture: true });

  const WORLD_W = CONFIG.world.w, WORLD_H = CONFIG.world.h;

  // ── MATH & OBSTACLE UTILS — distance, obstacle shape gen, collision push-out ──
  function dist(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }
  const rand = Math.random;

  const STAR_COUNT = 160;
  const stars = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: rand() * WORLD_W, y: rand() * WORLD_H,
      r: rand() * 1.4 + 0.4, baseAlpha: rand() * 0.5 + 0.15,
      twinkleFreq: rand() * 2 + 0.5, twinklePhase: rand() * Math.PI * 2,
    });

  // Slow far-away star layer for a bit of depth (drawn with a fraction of the camera offset).
  const FAR_STAR_COUNT = 90;
  const farStars = [];
  for (let i = 0; i < FAR_STAR_COUNT; i++) {
    farStars.push({
      x: rand() * WORLD_W, y: rand() * WORLD_H,
      r: rand() * 1.1 + 0.3, baseAlpha: rand() * 0.3 + 0.08,

  // Soft colored nebula clouds drifting behind everything, for atmosphere.
  const NEBULA_COUNT = 7;
  const nebulae = [];
  const nebulaPalette = ['#4fd8e0', '#ff5fd6', '#c65fff', '#ffd166'];
  for (let i = 0; i < NEBULA_COUNT; i++) {
    nebulae.push({
      x: rand() * WORLD_W, y: rand() * WORLD_H,
      r: rand() * 260 + 220,
      color: nebulaPalette[i % nebulaPalette.length],

  // Obstacles: solid crystal/wreckage clusters that block movement, bullets, and enemies.
  let obstacles = [];
  function makeObstaclePoints(r) {
    const n = 6 + Math.floor(rand() * 3);
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const jr = r * (0.72 + rand() * 0.42);
      pts.push([Math.cos(a) * jr, Math.sin(a) * jr]);
    }
    return pts;
  }
  function generateObstacles() {
    const cfg = CONFIG.obstacles;
    const cx = WORLD_W / 2, cy = WORLD_H / 2;
    const list = [];

    // Lay out a grid of cells covering the world, sized so there are noticeably
    // more cells than obstacles we need — then shuffle and jitter within each
    // chosen cell. This spreads obstacles evenly across the whole map instead
    // of letting pure random placement clump in some areas and leave others empty.
    const targetCells = Math.ceil(cfg.count * 1.8);
    const aspect = WORLD_W / WORLD_H;
    let cols = Math.max(1, Math.round(Math.sqrt(targetCells * aspect)));
    let rows = Math.max(1, Math.round(targetCells / cols));
    const cellW = WORLD_W / cols, cellH = WORLD_H / rows;

    const cells = [];
    for (let cy_i = 0; cy_i < rows; cy_i++) {
      for (let cx_i = 0; cx_i < cols; cx_i++) {
        cells.push({ cx: cx_i, cy: cy_i });
      }
    }
    // shuffle
    for (let i = cells.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [cells[i], cells[j]] = [cells[j], cells[i]];
    }

    for (const cell of cells) {
      if (list.length >= cfg.count) break;
      const r = cfg.minR + rand() * (cfg.maxR - cfg.minR);
      const pad = Math.min(cellW, cellH) * 0.18;
      const x = cell.cx * cellW + pad + rand() * (cellW - pad * 2);
      const y = cell.cy * cellH + pad + rand() * (cellH - pad * 2);
      if (x - r < 30 || x + r > WORLD_W - 30 || y - r < 30 || y + r > WORLD_H - 30) continue;
      if (dist(x, y, cx, cy) < cfg.minSpawnDist + r) continue;
      let ok = true;
      for (const o of list) {
        if (dist(x, y, o.x, o.y) < o.r + r + cfg.minGap) { ok = false; break; }
      }
      if (!ok) continue;
      list.push({
        x, y, r,
        rot: rand() * Math.PI * 2,
        color: cfg.colors[Math.floor(rand() * cfg.colors.length)],
        points: makeObstaclePoints(r),
      });
    }
    obstacles = list;
  }
  function resolveObstaclePush(entity) {
    for (const ob of obstacles) {
      const dx = entity.x - ob.x, dy = entity.y - ob.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 0.0001;
      const minD = entity.r + ob.r;
      if (d < minD) {
        const push = minD - d;
        entity.x += (dx / d) * push;
        entity.y += (dy / d) * push;
      }
    }
  }

  function expForLevel(level) {
    const L = CONFIG.leveling;

  function makePlayer(charId) {

      extraBullets: 0, bounceCount: 0, pierceCount: 0, magnetRadius: m.magnetRadius || 0,

      bulletRangeBonus: m.bulletRangeBonus || 0,
      laserWidthMult: 1, laserDpsMult: 1, laserLifestealPct: 0, // PRISM-only beam skills; harmless defaults for bullet users
      critChance: m.critChance || 0, lifeSteal: m.lifeSteal || 0,
      thornDamage: m.thornDamage || 0, thornRadius: m.thornRadius || 0, thornBaseRadius: m.thornRadius || 150,
      dmgReduction: m.dmgReduction || 0,
      explosiveChance: 0, knockback: 0,
      shieldMax: 0, shieldCharges: 0, shieldStacksApplied: 0, shieldInvulnUntil: 0,
      skillChoiceCount: 3 + (m.skillChoiceBonus || 0),

  // Shield Generator stacks are non-rechargeable: a stack grants a passive buff while it's
  // still "charged", and both the absorb-hit and the buff go away together once it's spent.
  // This reconciles player.speed / bulletDamageMult / fireRate whenever the active stack
  // count changes (gaining a stack from the skill, or losing one by absorbing a hit).
  function syncShieldStacks(p, newStacks) {
    const sc = CONFIG.player;
    const oldStacks = p.shieldStacksApplied || 0;
    newStacks = Math.max(0, Math.min(sc.shieldMaxStacks, newStacks));
    if (newStacks === oldStacks) return;
    const oldSpeedMult = 1 + sc.shieldSpeedPerStack * oldStacks;
    const newSpeedMult = 1 + sc.shieldSpeedPerStack * newStacks;
    p.speed = p.speed / oldSpeedMult * newSpeedMult;

    const oldDmgMult = 1 + sc.shieldDmgPerStack * oldStacks;
    const newDmgMult = 1 + sc.shieldDmgPerStack * newStacks;
    p.bulletDamageMult = (p.bulletDamageMult || 1) / oldDmgMult * newDmgMult;

    const oldAtkMult = 1 + sc.shieldAtkSpeedPerStack * oldStacks;
    const newAtkMult = 1 + sc.shieldAtkSpeedPerStack * newStacks;
    p.baseFireRate = p.baseFireRate * oldAtkMult / newAtkMult;
    p.fireRate = p.fireRate * oldAtkMult / newAtkMult;

    p.shieldStacksApplied = newStacks;
  }

  let player = makePlayer(selectedCharacter);

  function makeStick(zoneEl, knobEl, deadzonePx, fireThreshold, stickMaxR) {
    const state = { active: false, dx: 0, dy: 0, mag: 0, pointerId: null };
    let originX = 0, originY = 0;
    const maxR = stickMaxR || 44;
    const setKnob = (dx, dy) => { knobEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; };

    function start(e) {
      const rect = zoneEl.getBoundingClientRect();
      originX = rect.left + rect.width / 2; originY = rect.top + rect.height / 2;
      state.active = true; state.pointerId = e.pointerId;
      move(e);
      zoneEl.setPointerCapture && zoneEl.setPointerCapture(e.pointerId);
    }
    function move(e) {
      if (!state.active || e.pointerId !== state.pointerId) return;
      const dx = e.clientX - originX, dy = e.clientY - originY;
      const d = Math.sqrt(dx * dx + dy * dy);
      const ang = Math.atan2(dy, dx);
      setKnob(Math.cos(ang) * Math.min(d, maxR), Math.sin(ang) * Math.min(d, maxR));
      if (d < deadzonePx) { state.dx = 0; state.dy = 0; state.mag = 0; }
      else { state.dx = Math.cos(ang); state.dy = Math.sin(ang); state.mag = Math.min(d / maxR, 1); }
      // Visual cue for sticks that double as a fire trigger (see aimStick below): once the
      // push crosses fireThreshold the knob lights up pink so it's clear a light aim-only
      // nudge has turned into an actual "firing" push.
      if (fireThreshold != null) knobEl.classList.toggle('firing', state.mag > fireThreshold);
    }
    function end(e) {
      if (e.pointerId !== state.pointerId) return;
      state.active = false; state.dx = 0; state.dy = 0; state.mag = 0; state.pointerId = null;
      setKnob(0, 0);
      if (fireThreshold != null) knobEl.classList.remove('firing');
    }
    zoneEl.addEventListener('pointerdown', start);
    zoneEl.addEventListener('pointermove', move);
    zoneEl.addEventListener('pointerup', end);
    zoneEl.addEventListener('pointercancel', end);
    zoneEl.addEventListener('pointerleave', e => { if (state.pointerId === e.pointerId) end(e); });
    return state;
  }
  const moveStick = makeStick(document.getElementById('moveZone'), document.getElementById('moveKnob'), 8);
  const aimStick = makeStick(document.getElementById('aimZone'), document.getElementById('aimKnob'), 6, 0.6, 54);

  const cam = { x: 0, y: 0 };

  // ── CHARACTER SELECT UI — icon svg + card builder ──
  function charIconSvg(shape, color) {
    if (shape === 'square') return `<svg viewBox="0 0 44 44"><rect x="8" y="8" width="28" height="28" fill="${color}"/></svg>`;
    if (shape === 'triangle') return `<svg viewBox="0 0 44 44"><polygon points="36,22 8,10 15,22 8,34" fill="${color}"/></svg>`;
    if (shape === 'diamond') return `<svg viewBox="0 0 44 44"><polygon points="38,22 22,6 6,22 22,38" fill="${color}"/></svg>`;
    return `<svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="15" fill="${color}"/></svg>`;

  function buildCharSelect() {

  function startGame() {

  function continueGame() {
    const save = loadCheckpoint();

    player.reloading = false;
    player.magCurrent = player.magazineSize;
    player.shieldInvulnUntil = 0;
    // Backfill fields added after this save might have been written — an older save won't
    // have the beam heat system, and NaN/undefined here would silently disable the limit
    // (NaN <= 0 is always false) and show "BEAM NaN%" in the HUD.
    if (typeof player.laserHeat !== 'number' || Number.isNaN(player.laserHeat)) player.laserHeat = CONFIG.weapons.laser.maxHeat;
    if (typeof player.laserOverheated !== 'boolean') player.laserOverheated = false;
    if (typeof player.laserHeatDrainMult !== 'number') player.laserHeatDrainMult = 1;
    if (typeof player.laserHeatRegenMult !== 'number') player.laserHeatRegenMult = 1;
    if (typeof player.overdriveUntil !== 'number') player.overdriveUntil = 0;
    firstLevelSkillIds = new Set(Object.keys(player.skills || {}));

  const SKILL_POOL = [

      apply(p) { p.laserDpsMult = (p.laserDpsMult || 1) * 1.20; } },
    { id: 'beamleech',  name: 'Beam Leech',                desc: 'Heal for 2% of all beam damage dealt (max 3 stacks)', maxStacks: 3, laserOnly: true,
      apply(p) { p.laserLifestealPct = (p.laserLifestealPct || 0) + 0.02; } },
    { id: 'coolant',   name: 'Coolant Injector',           desc: '-20% beam heat drain, +20% beam heat regen (max 3 stacks)', maxStacks: 3, laserOnly: true,
      apply(p) { p.laserHeatDrainMult = (p.laserHeatDrainMult || 1) * 0.8; p.laserHeatRegenMult = (p.laserHeatRegenMult || 1) * 1.2; } },
